[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autodancer"
version = "0.1.0"
description = "Lua-connected reinforcement learning environment for Crypt of the NecroDancer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "gymnasium>=0.29,<1",
  "numpy>=1.26,<2",
  "psutil>=6,<8",
]

[project.optional-dependencies]
train = [
  "tensorboard>=2.17",
  "torch>=2.3",
]
lineage = [
  "mlflow>=3.5,<4",
  "pyyaml>=6,<7",
]
test = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
autodancer-live-run = "autodancer.live.run:main"
autodancer-live-explore = "autodancer.live.explore:main"
autodancer-live-start = "autodancer.live.start:main"
autodancer-live-smoke = "autodancer.live.smoke:main"
autodancer-train = "autodancer.training.train:main"
autodancer-baseline = "autodancer.training.baseline:main"
autodancer-boss-identities = "autodancer.training.boss_identity:main"
autodancer-benchmark = "autodancer.training.benchmark:main"
autodancer-diagnose = "autodancer.live.diagnose:main"
autodancer-representation = "autodancer.training.representation:main"
autodancer-reward-compare = "autodancer.training.reward_compare:main"
autodancer-qualify = "autodancer.live.qualify:main"
autodancer-experiment = "autodancer.experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodancer"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
