[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autodancer"
version = "0.1.0"
description = "Lua-connected reinforcement learning environment for Crypt of the NecroDancer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "gymnasium>=0.29,<1",
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
train = [
  "sample-factory>=2.1.1,<3; platform_system != 'Windows'",
  "tensorboard>=2.17",
  "torch>=2.3",
]
test = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
autodancer-live-run = "autodancer.live.run:main"
autodancer-live-explore = "autodancer.live.explore:main"
autodancer-live-start = "autodancer.live.start:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodancer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
