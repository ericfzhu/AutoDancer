[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autodancer"
version = "0.1.0"
description = "Simulator-first reinforcement learning environments for Crypt of the NecroDancer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "gymnasium>=0.29,<1",
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
train = [
  "sample-factory>=2.1.1,<3",
  "tensorboard>=2.17",
  "torch>=2.3",
]
macos = [
  "pillow>=10.4",
  "pyobjc-framework-Quartz>=10.3",
]
windows = [
  "pillow>=10.4",
]
test = [
  "hypothesis>=6.112",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
autodancer-train = "autodancer.training.train:main"
autodancer-compare-trace = "autodancer.live.trace:main"
autodancer-random-baseline = "autodancer.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodancer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
