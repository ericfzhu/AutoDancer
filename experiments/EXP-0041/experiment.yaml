decision_rule: Diagnostic only; no promotion. Report update-wise full-batch policy
  movement and paired boss damage, contact, completions and deaths. First require
  retained development boss damage (at least the source total of 2) and retained total
  contact episodes (at least 8/48); this is a descriptive screen, not statistical
  proof. A development completion increase of at least 0.10 with nondecreasing training
  completion motivates replication. If retention passes but learning remains flat,
  investigate curriculum difficulty next with reward fixed. If retention fails, use
  saved rollout diagnostics before further training. Scope, recovery, source, replay,
  numerical or budget failures invalidate the attempt.
