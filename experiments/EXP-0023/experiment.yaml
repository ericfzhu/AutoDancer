schema_version: 1
id: EXP-0023
title: Legal phase-3 Death Metal successor acquisition
question: Can an A8 learner, handed the exact live game after a frozen guide legally reaches Death Metal phase 3, learn the remaining boss segment and enter Zone 2 repeatably across unseen seeds?
hypothesis: EXP-0022 made phase 3 reachable but complete fights too sparse. Starting learner transitions only after an ordinary-action guide reaches phase 3 should supply enough final-segment experience for terminal-canceling boss-health potential and real level rewards to produce repeatable clears without rewarding failed partial damage.
changed_blocks: [reward, training-level-distribution, evaluation]
component_versions:
  reward: DeathMetalPotentialV5
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-qualified
  environment-semantics: legal-death-metal-phase3-handoff-v5
  learner-diagnostics: boss-objective-v3
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: A8-phase3-successor-fresh-critic-v1
  training-level-distribution: legal-natural-prefix-phase3-v2
  runtime: async-native-pipe-v1
  evaluation: legal-phase3-successor-v11
invariants:
  - the exact passed eight-worker one-million-transition controller qualification is required before training
  - every attempt starts from normal seeded All Zones followed by real-game sequential GOTO to Zone 1 Floor 4
  - player20 changes only Bard's starting current and maximum health; boss and boss-add state remains untouched
  - the frozen guide acts through the same eleven-action acknowledged live controller as the learner
  - a handoff requires observed boss health at or below four and at least three distinct official Death Metal actor phases
  - visible boss-health loss is authoritative for legal direct and bomb damage; direct damage events remain diagnostic rather than a handoff prerequisite
  - guide transitions never enter PPO and every learner fragment begins at the exact running post-action state
  - learner recurrent state is warmed by the complete guide observation/action/reward sequence before handoff
  - the learner reward rebases boss-health potential to zero at the exact handoff and terminally cancels failed partial progress
  - direct boss damage and boss kill shaping are zero; only state potential and real floor, zone, or victory events can provide positive objective reward
  - the 500-turn learner cutoff is a nonterminal bootstrapped collection truncation and receives no reward
  - failed guide acquisitions remain recorded outcomes and in the unconditional evaluation denominator
  - the source checkpoint, guide checkpoint, and initializer are the exact EXP-0022 seed-86002 final bytes
  - source actor, recurrent transition, and logits are preserved while critic, optimizer, episode state, and RNG are fresh
  - the inherited actor base is frozen for exactly ten PPO updates and then jointly optimized
  - calibration, training, and evaluation game-seed banks are disjoint and calibration observes boss identity only
  - exactly eight fixed-capacity workers, one policy version per rollout, and zero natural infrastructure contamination are required
  - shaped return never selects a checkpoint; acquisition, live boss clear, and Zone 2 entry are the primary evidence
  - no phase-3 or player20 result constitutes normal-start Zone 2 evidence
