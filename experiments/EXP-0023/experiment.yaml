decision_rule: Accept only if aggregate phase-3 acquisition is at least 50 percent, aggregate unconditional Zone 2 entry is at least 15 percent, completion conditional on acquired handoffs is at least 25 percent, at least two trials have at least 10 percent unconditional Zone 2 entry, at least eight distinct held-out game seeds complete across trials, every trial completes at least one seed, and all controller invariants hold. Rank passing trials lexicographically by distinct Zone 2 seeds, unconditional completion rate, conditional completion rate, acquisition rate, death rate, then learner turns. If acquisition fails, move the boundary back to separately declared phase 2; if acquisition succeeds but completion fails, reject V5/final-segment learning before changing architecture. A pass authorizes player-health contraction at the same boundary, then phase 2 and full-boss starts, and finally backward expansion through normal floors; it is not normal-start promotion.
