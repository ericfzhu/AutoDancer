schema_version: 1
id: EXP-0039
title: First-update signal and replay audit
question: Can the zero-reward first-update behavior be reproduced, and how much policy
  movement occurs with and without the existing KL guard on the same batch?
hypothesis: Inherited values can create nonzero advantages despite zero observed rewards;
  a KL stop may limit further policy movement without addressing reward sparsity.
changed_blocks:
- evaluation
component_versions:
  observation: bounded-bard-controls-v1
  action-contract: bounded-bard-navigation-v1
  training-level-distribution: bounded-direct-pilot-v1
  evaluation: first-update-audit-v1
  controller: schema10-bounded-refresh-v1
  architecture: A8
  reward: DeathMetalPotentialV5
invariants:
- Collect exactly one 1024-transition batch with the EXP-0038 source, optimizer seed,
  8 workers, loadout guard, reward, seeds and recurrent settings. No development or
  final-test gameplay.
- Save observations, actions, old log probabilities, values, boundary flags, recurrent
  states, initial model/optimizer and RNG before the update. This is a new capture,
  not a claimed exact replay of lost historical data.
- Audit pre-update log-probability parity; abort causal interpretation if maximum
  absolute replay difference exceeds 0.001.
- Apply the original update once; separately restore identical initial weights and
  RNG and update the same batch with target_kl=0.02. This threshold is a diagnostic
  intervention, not selected for gameplay performance.
- Report sampled-action approximate KL over the entire saved batch after updating,
  plus minibatch-averaged training metrics and advantage distribution by action. No
  gameplay evaluation or policy promotion.
- Ten-minute total execution cap; scope violation, recovery, nonfinite metrics or
  source drift invalidates the diagnostic.
