schema_version: 1
id: EXP-0031
title: Second retained live Death Metal handoff-window expansion
question: Can the accepted tail-32-through-tail-36 policy move to the next earlier live competence boundary while retaining every mastered handoff?
hypothesis: EXP-0030 acquired tail 36 at 25/27 frozen completion while retaining tail 32 at 25/27. Replaying both accepted starts plus each calibrated four-action step through the next 10--90 percent frontier should expand boss control without catastrophic forgetting.
changed_blocks: [training-level-distribution, evaluation]
component_versions:
  reward: DeathMetalPotentialV5
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-requalified-current-hashes
  environment-semantics: player-health-only-boss-curriculum-v4
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v2-warm-boundary-state
  training-level-distribution: qualified-trace-window-v9
  data-selection: disclosed-qualified-training-traces-v1
  runtime: async-native-pipe-v1
  evaluation: conditional-trace-window-v18
invariants:
  - source calibration evaluates tails 40 through 80 in four-action increments plus tail 81 and selects the shortest boundary inside the closed 10--90 percent completion band
  - calibration uses deterministic execution and fixed stochastic policy seeds 98001 through 98004 on all three qualified training seeds
  - training samples a balanced window containing retained tails 32 and 36 plus every tested four-action boundary through the selected frontier
  - handoff selection is deterministic by worker slot and checkpointed episode count, independent of actor timing
  - guide transitions remain acknowledged live actions outside PPO and warm the exact learner recurrent state and stable reward feedback
  - frozen evaluation scores tails 32, 36, and the selected harder tail separately under deterministic execution and stochastic seeds 98001 and 98002
  - every retained boundary must independently remain at least 80 percent successful; aggregate retention cannot hide forgetting
  - all 930xx held-out seeds remain excluded from calibration, training, and trace acquisition
  - assisted completion never counts as normal-start Zone 2 evidence
  - exactly eight workers, finite losses, zero controller restarts, and current qualification hashes are required
arms:
  - id: a8-retained-trace-window-2
    description: Three A8 PPO replications initialize from the accepted EXP-0030 checkpoint and train uniformly over the complete retained-to-frontier live handoff window.
