  primary_outcome: conditional live Zone 2 entry at the selected expanded boundary
  retention_outcome: conditional live Zone 2 entry at every retained boundary
decision_rule: Accept the expansion only if the selected harder boundary aggregates at least 10 percent completion, at least two trials reach 5 percent, every trial completes at least once, all three trace seeds complete, each of tails 32 and 36 independently remains at least 80 percent successful, losses are finite, and training plus evaluation have zero controller restarts. A pass below tail 81 authorizes another retained-window expansion; a pass at tail 81 authorizes a separately registered prefix-free full-boss test. No assisted outcome is normal-start promotion.
