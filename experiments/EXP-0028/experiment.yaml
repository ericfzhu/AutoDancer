  modes: [deterministic, stochastic-98001, stochastic-98002]
  learner_turn_cap: 64
  primary_outcome: conditional live Zone 2 entry after handoff
  diagnostics: [source boundary curve, final-policy completion rate, distinct completion seeds, learner turns, finite losses, worker restarts, recurrent likelihood consistency]
decision_rule: Advance to a retained multi-boundary window only if all three frozen final checkpoints complete at least once, aggregate conditional completion is at least 10 percent, at least two trials complete at least 5 percent, at least three distinct trace seeds complete, losses are finite, and calibration, training, and evaluation have zero controller restarts. Otherwise reject this boundary and diagnose acquisition before changing reward or architecture. No assisted result is normal-start promotion.
