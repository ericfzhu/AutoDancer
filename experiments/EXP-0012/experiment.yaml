schema_version: 1
id: EXP-0012
title: Human-equivalent map navigation prior ablation
question: Does a combat-gated navigation prior using the already available persistent floor memory convert valid traversal cycles into repeatable floor progress without changing the checkpoint or rewards?
hypothesis: Outside combat, routing toward known stairs and preferring least-visited adjacent directions will reduce valid movement cycles and step limits while preserving A2's local combat competence.
