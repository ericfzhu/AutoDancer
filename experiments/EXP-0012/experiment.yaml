    - mode: stochastic
      policy_seed: 94001
    - mode: stochastic
      policy_seed: 94002
  primary_outcome: normal-start floor and zone progress on unseen seeds
  diagnostics:
    - navigation-prior activation and effective directional masking
    - step limits, valid movement cycles, unchanged-position turns, and unique positions
    - staircase discovery, discovery-to-exit conversion, and exit latency
    - kills, item pickups, damage, deaths, and action-outcome counts
decision_rule: The map prior passes only if all reports are controller-valid, aggregate mean floor progress improves, step-limit rate is at most half the current contract, kills and item pickups each remain at least 80% of control, progress improves in at least two of three policy modes, and tests plus live outcomes show no combat or successful-dig suppression. Passing authorizes a separately declared training comparison. Zone 2 promotion still requires at least three distinct unseen seeds and at least two repeated successes across the two stochastic samples.
