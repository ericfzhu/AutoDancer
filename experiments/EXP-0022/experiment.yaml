schema_version: 1
id: EXP-0022
title: Outcome-aligned legal Death Metal guide acquisition
question: Does removing the guide reward's demonstrated survival-over-contact preference preserve inherited boss engagement and produce repeatable deep Death Metal phases?
hypothesis: With player-damage and death shaping removed, authoritative boss contact has nonnegative return while passive avoidance remains zero; the A2-to-A8 student should retain contact beyond 30,000 transitions and improve held-out phase depth instead of converging to 500-turn zero-contact episodes.
changed_blocks: [reward, evaluation]
component_versions:
  reward: DeathMetalGuideV3
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-qualified
  environment-semantics: player-health-only-boss-curriculum-v4
  learner-diagnostics: boss-objective-v3
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: A2-to-A8-actor-parity-fresh-critic-v2
  training-level-distribution: reverse-curriculum-sequential-goto-v1
  runtime: async-native-pipe-v1
  evaluation: legal-death-metal-guide-v10
invariants:
  - the exact passed eight-worker one-million-transition controller qualification is required before training
  - Bard begins from normal seeded All Zones followed by real-game sequential GOTO to Zone 1 Floor 4
  - player20 changes only Bard's starting current and maximum health; boss and boss-add state remains untouched
  - only authoritative data.boss damage and kill events receive guide combat credit
  - boss combat credit remains entity-deduplicated and floor-capped below real floor plus zone completion
  - player damage and gameplay death produce exactly zero guide credit; infrastructure faults remain invalid rather than gameplay
  - the 500-turn client cutoff remains a nonterminal bootstrapped collection truncation and receives no reward
  - EXP-0021 and EXP-0022 differ only in player_damage minus 0.05 to 0 and death minus 2 to 0, plus disjoint seeds and evaluation identity
  - source actor, recurrent transition, and logits are preserved at initialization while critic, optimizer, episode state, and RNG are fresh
  - the inherited actor base is frozen for exactly ten PPO updates and then jointly optimized
  - calibration, training, and evaluation banks are disjoint and calibration observes boss identity only
  - every selected seed is telemetry-confirmed Death Metal; no candidate is selected by policy performance
  - exactly eight fixed-capacity workers, one policy version per rollout, and zero natural infrastructure contamination are required
  - shaped return never selects a checkpoint; phase acquisition and live Zone 2 entry are the primary evidence
  - no player20 result constitutes unassisted boss completion or normal-start Zone 2 evidence
arms:
  - id: a8-player20-outcome-aligned-guide
    description: Three independent A8 trials initialized at exact A2 actor parity and trained on untouched Death Metal with boss-only positive acquisition credit and no survival penalties.
