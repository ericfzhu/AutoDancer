  modes: [deterministic, stochastic-87001, stochastic-87002]
  primary_outcome: authoritative Death Metal phase-4 acquisition with all selected seeds retained in the denominator
  secondary_outcomes: [live Zone 2 Floor 1 entry, phase depth, authoritative boss damage, boss kills, zero-contact timeouts, deaths, turns]
  diagnostics: [action distribution, wait rate, idle rate, wall attempts, boss actor types, boss health, reward components, entropy, KL, clipping, gradients, controller validity]
decision_rule: Accept a legal guide only if the three-final aggregate phase-4 rate is at least 25 percent, at least two finals reach phase 4 on at least 20 percent of held-out seeds, at least 12 distinct held-out seeds reach phase 4 across finals, every final deals nonzero boss damage, mean boss damage improves over the matched parent, and controller invariants hold. Select lexicographically by Zone 2 entries, phase-4 rate, mean phase depth, boss damage, zero-contact timeout rate, death rate, then turns. If the gate fails but contact remains materially above EXP-0021, retain the parent and test decaying teacher-policy KL under this same reward. If contact again collapses, diagnose actor retention before any architecture scaling. A passing guide authorizes separately declared assistance reduction and backward start-distribution expansion; it is not normal-start promotion.
