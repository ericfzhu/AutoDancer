  primary_outcome: authoritative Death Metal phase-4 acquisition with every selected seed retained in the denominator
  secondary_outcomes: [live Zone 2 Floor 1 entry, phase depth, authoritative boss damage, boss kills, deaths, turns]
  diagnostics: [boss actor types, initial and minimum objective health, phase depth, phase-4 reached, acquisition failure, action distribution, entropy, explained variance, KL, clipping, gradient norms, controller validity, worker capacity, restarts]
decision_rule: Accept a legal guide only if the three-checkpoint aggregate phase-4 rate is at least 25 percent, at least two of three final checkpoints reach phase 4 on at least 20 percent of held-out seeds, at least 12 distinct held-out seeds reach phase 4 somewhere across the three finals, boss damage improves over the matched frozen parent, and every controller-validity invariant holds. Select lexicographically by Zone 2 entries, phase-4 rate, mean phase depth, boss damage, death rate, then turns. If the gate fails, retain the parent and diagnose phase-specific action/state coverage without changing reward post hoc. A passing guide authorizes separately declared phase-3, phase-2, and full-boss horizon expansion; it is not itself normal-start promotion.
