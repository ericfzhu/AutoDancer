schema_version: 1
id: EXP-0020
title: Legal Death Metal guide acquisition
question: Can a function-preserving A2-to-A8 warm start learn repeatable deep Death Metal phases when only Bard's starting health is increased and every boss objective remains untouched?
hypothesis: The selected A2 policy already supplies local movement and combat competence, while A8 can learn from authoritative boss identity, objective health, persistent map, and event context; player20 assistance should lengthen legally generated trajectories enough for PPO to acquire phase-4 Death Metal behavior without corrupting the task.
changed_blocks: [reward, architecture, controller, environment-semantics, learner-diagnostics, optimization-schedule, training-level-distribution, evaluation]
component_versions:
  reward: DeathMetalGuideV1
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-player-health-only-candidate
  environment-semantics: player-health-only-boss-curriculum-v4
  learner-diagnostics: boss-objective-v3
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: A2-to-A8-actor-parity-fresh-critic-v2
  training-level-distribution: reverse-curriculum-sequential-goto-v1
  runtime: async-native-pipe-v1
  evaluation: legal-death-metal-guide-v9
invariants:
  - training cannot start until the exact repository mod hashes pass a fresh eight-worker one-million-transition controller qualification
  - Bard begins from a normal seeded All Zones run followed by real-game sequential GOTO to Zone 1 Floor 4
  - player20 changes only Bard's starting current and maximum health; every boss and boss-add identity, role, current health, and maximum health is snapshotted and exactly unchanged
  - assistance is applied once before collection and emits no transition, gameplay event, or reward
  - the source A2 actor, recurrent state transition, and action logits are exactly preserved at initialization while critic, optimizer, episode state, and RNG are fresh
  - A8's inherited A2 base is frozen for exactly ten PPO updates and then jointly optimized
  - calibration, training, and evaluation candidate ranges are disjoint; calibration observes boss identity only and never policy performance
  - every selected game seed is telemetry-confirmed as Death Metal before training or evaluation
  - acquisition failures and infrastructure-invalid episodes remain visible and can never be scored as deaths, aborts, or successful gameplay
  - exactly eight fixed-capacity workers, one policy version per rollout, and zero natural infrastructure contamination are required
  - task reward, shaping reward, phase acquisition, deaths, and Zone 2 entry remain separate; shaped return never selects a checkpoint
  - no player20 result constitutes unassisted boss completion or normal-start Zone 2 evidence
arms:
  - id: a8-player20-legal-guide
    description: Three independent A8 trials initialized at exact A2 actor parity, trained against untouched full-health Death Metal with player20 survival assistance.
