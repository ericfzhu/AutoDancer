schema_version: 1
blocks:
  reward:
    versions:
      V1: First stateful progress-first profile.
      V2:
        description: Stair-guided local-competence baseline.
        config: configs/reward-v2.json
        config_sha256: 84494b038f1d6c8e144d72e84dbca7227de2881f5ab8973b384758d7aff53b12
      V3: Bounded progression-first profile, rejected.
      V4A:
        description: Competence restoration with weaker stair potential, rejected.
        config: configs/reward-v4a.json
        config_sha256: 42b373a1704151a4dab22abfb88e7df31d5052284a57351e4bb8ebd4a557fab7
      V4B:
        description: Competence restoration with doubled stair potential, rejected.
        config: configs/reward-v4b.json
        config_sha256: b733e501afcd177d8f90fc2fdeac9d00c7c2b317527ee0d066fe0ad59248457c
  architecture:
    versions:
      A2: Entity-attention recurrent actor-critic baseline.
      A6: Rich observation architecture, rejected.
      A7: Function-preserving gated sensory adapter, rejected.
      A8: Zero-projected staged residual, inconclusive.
  observation:
    versions:
      legacy-A2: Local grid, player, inventory, entities, and action mask.
      schema9-rich: Persistent floor memory and richer stacked cell semantics.
  controller:
    versions:
      historical-live: Live bridge predating the schema-10 hard qualification.
      schema10-qualified: Launch-bound duplex pipe controller qualified for one million turns.
      schema10-requalified-current-hashes: Schema-10 controller requalified for one million transitions with experiment startup bound to exact mod hashes.
  environment-semantics:
    versions:
      truncation-damage-events-v2: Time limits bootstrap rather than terminalize, player damage uses actual health loss, and item/currency/descent events have distinct meanings.
  learner-diagnostics:
    versions:
      critic-health-v2: Explained variance plus value, return, raw-advantage, reward-scale, and pre-clipping gradient diagnostics.
  action-contract:
    versions:
      legacy-11: Earlier eleven-action masking behavior.
      current-11: Current qualified eleven-action contract.
      known-invalid-wall-v1: Episode-local memory masks an exact directional state only after the live game authoritatively reports a wall no-op; changed structure, control state, or inventory reopens it.
      controlled-current-vs-known-invalid-wall-v1: Frozen-checkpoint ablation between current-11 and known-invalid-wall-v1.
      map-navigation-prior-v1: Outside combat, combine exact wall memory with the persistent floor map to route toward known stairs or prefer least-visited adjacent directions; combat and available special actions remain policy-controlled.
      controlled-current-vs-map-navigation-prior-v1: Frozen-checkpoint ablation between current-11 and the hybrid human-equivalent map navigation prior.
  algorithm:
    versions:
      recurrent-ppo-v1: GRU/LSTM-compatible 128-turn rollout PPO with 32-turn chunks.
      recurrent-ppo-v1-corrected-truncation: Recurrent PPO v1 with separate true termination and time-limit bootstrap values.
  optimization-schedule:
    versions:
      frozen-policy: No optimizer updates; evaluate the promoted checkpoint unchanged.
      default-ppo: All trainable parameters update from the first PPO update.
      A8-staged: Freeze the A2 base for ten updates, then jointly optimize.
      A8-horizon-continuation: Resume the qualified 30,720-transition A2 and A8 states and extend both to 250,880 transitions without resetting optimizer or RNG state.
      250880-transition-single-seed: Warm-start non-critic A2 weights, reset critic/optimizer/RNG, and train one full 250,880-transition causal replication.
  training-level-distribution:
    versions:
      unbounded-random-v1: Each worker samples fresh 31-bit procedural seeds from an independent deterministic stream.
      uniform-finite-pool-v1: Each worker samples from one declared finite seed pool; independent streams and exact next-draw state are checkpointed.
      prioritized-level-replay-v1: Planned finite-pool replay weighted by measured learning potential; not yet implemented or authorized for an experiment.
  runtime:
    versions:
      historical-sync: Earlier synchronous or partially synchronous live collection.
      async-native-pipe-v1: Versioned asynchronous native-pipe actor collection.
  evaluation:
    versions:
      heldout-live-v1: Deterministic held-out live-game episodes with gameplay metrics.
      schema10-async-v1: Qualified asynchronous deterministic evaluation.
      schema10-stochastic-v1: Qualified asynchronous evaluation with timing-independent, seed-reproducible samples from the trained categorical policy alongside argmax control runs.
      deterministic-plus-turn-keyed-stochastic-v2: Corrected-metric evaluation using argmax and two reproducible sampled-policy streams with explicit descent and item/currency attribution.
      action-outcome-contract-v3: V2 evaluation plus authoritative action-outcome counts, wall-attempt rate, learned invalid-wall signatures, and effective-mask diagnostics.
      map-navigation-contract-v4: Action-outcome evaluation plus navigation-prior activation, effective directional masking, staircase conversion, traversal diversity, and valid-cycle diagnostics.
