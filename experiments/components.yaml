schema_version: 1
blocks:
  reward:
    versions:
      V1: First stateful progress-first profile.
      V2:
        description: Stair-guided local-competence baseline.
        config: configs/reward-v2.json
        config_sha256: 84494b038f1d6c8e144d72e84dbca7227de2881f5ab8973b384758d7aff53b12
      V3: Bounded progression-first profile, rejected.
      V4A:
        description: Competence restoration with weaker stair potential, rejected.
        config: configs/reward-v4a.json
        config_sha256: 42b373a1704151a4dab22abfb88e7df31d5052284a57351e4bb8ebd4a557fab7
      V4B:
        description: Competence restoration with doubled stair potential, rejected.
        config: configs/reward-v4b.json
        config_sha256: b733e501afcd177d8f90fc2fdeac9d00c7c2b317527ee0d066fe0ad59248457c
      DeathMetalGuideV1:
        description: Rejected pre-execution because its nominal boss guide credited all enemy damage and kills, allowing incidental enemies to consume the shaping budget.
        config: configs/reward-death-metal-guide-v1.json
        config_sha256: 650b2d3e8bfdb378bcdf2b63045f9ee2f71a4d229eb49af3474eb767a07732e4
      DeathMetalGuideV2:
        description: Non-renewable Death Metal guide restricted to authoritative boss-tagged damage and kills, plus survival and real level transitions.
        config: configs/reward-death-metal-guide-v2.json
        config_sha256: e2d35ec226b90b64477f49e1aa07ac7752929d38de5cf238a300294cd3c838d4
      DeathMetalGuideV3:
        description: Outcome-aligned boss-only guide that removes player-damage and death penalties after EXP-0021 demonstrated that they made zero-contact timeout preferable to unsuccessful boss practice.
        config: configs/reward-death-metal-guide-v3.json
        config_sha256: ed80eade70d8133ada9cd7eff44db3fbff6a1657a6e07e7df72e0bd29891096e
      DeathMetalPotentialV5:
        description: Candidate phase-curriculum reward using terminal-canceling visible boss-health potential relative to the legal handoff; direct and indirect player progress such as bombs is represented, while repeated damage followed by death has zero discounted shaping return.
        config: configs/reward-death-metal-potential-v5.json
        config_sha256: b630fd1816b032f0e3a4222d61e8ef79529c816dbb440f27647c0cc967172131
  architecture:
    versions:
      A2: Entity-attention recurrent actor-critic baseline.
      A6: Rich observation architecture, rejected.
      A7: Function-preserving gated sensory adapter, rejected.
      A8: Zero-projected staged residual, inconclusive.
  observation:
    versions:
      legacy-A2: Local grid, player, inventory, entities, and action mask.
      schema9-rich: Persistent floor memory and richer stacked cell semantics.
      schema10-corrected-memory-boss: Correct current visibility, retain a complete 65x65 floor in 129x129 player-relative memory, and expose official boss type plus boss-objective telemetry without expanding A2's input width.
  controller:
    versions:
      historical-live: Live bridge predating the schema-10 hard qualification.
      schema10-qualified: Launch-bound duplex pipe controller qualified for one million turns.
      schema10-requalified-current-hashes: Schema-10 controller requalified for one million transitions with experiment startup bound to exact mod hashes.
      schema10-player-health-only-candidate: Schema-10 controller candidate with cross-language-validated player-only assistance; requires a fresh million-transition qualification before use.
  environment-semantics:
    versions:
      truncation-damage-events-v2: Time limits bootstrap rather than terminalize, player damage uses actual health loss, and item/currency/descent events have distinct meanings.
      curriculum-level-start-v1: A normal seeded reset followed by sequential real-game level transitions, with map/reward/recurrent state reset at the declared start and an explicit target-level subtask terminal.
      assisted-single-boss-curriculum-v2: A tagged training-only real-game boss start which may set the player's starting health and current boss-objective health; assistance applies once at setup, emits no trajectory transition, and completion still requires the live game to enter the next zone.
      mixed-assisted-curriculum-v3: Per-episode live boss starts draw one of several declared assistance profiles from an exact checkpointed distribution, with mastered-start replay and same-task infrastructure recovery.
      player-health-only-boss-curriculum-v4: A tagged training-only real-game boss start may increase Bard's starting health but snapshots and requires exact preservation of every boss and boss-add objective before collection begins.
      legal-death-metal-phase3-handoff-v5: A frozen policy uses only ordinary acknowledged actions from the player-health-only live boss start; the learner inherits the exact running state only after observed health loss and three distinct official Death Metal phase entities prove a legal phase-3 boundary.
      qualified-trace-handoff-v6: A fresh live reset replays an exact successful action prefix only after the complete trace reproduced terminal gameplay and every normalized observation digest on a fresh launch; the same process is handed to the learner without state mutation, guide transitions are excluded, and divergence fails the run closed.
  learner-diagnostics:
    versions:
      critic-health-v2: Explained variance plus value, return, raw-advantage, reward-scale, and pre-clipping gradient diagnostics.
      boss-objective-v3: Critic-health diagnostics plus separate boss, boss-add, and generic-enemy damage and kill attribution, official boss identity, curriculum completion, and episode-horizon lineage.
  action-contract:
    versions:
      legacy-11: Earlier eleven-action masking behavior.
      current-11: Current qualified eleven-action contract.
      known-invalid-wall-v1: Episode-local memory masks an exact directional state only after the live game authoritatively reports a wall no-op; changed structure, control state, or inventory reopens it.
      controlled-current-vs-known-invalid-wall-v1: Frozen-checkpoint ablation between current-11 and known-invalid-wall-v1.
      map-navigation-prior-v1: Outside combat, combine exact wall memory with the persistent floor map to route toward known stairs or prefer least-visited adjacent directions; combat and available special actions remain policy-controlled.
      controlled-current-vs-map-navigation-prior-v1: Frozen-checkpoint ablation between current-11 and the hybrid human-equivalent map navigation prior.
  algorithm:
    versions:
      recurrent-ppo-v1: GRU/LSTM-compatible 128-turn rollout PPO with 32-turn chunks.
      recurrent-ppo-v1-corrected-truncation: Recurrent PPO v1 with separate true termination and time-limit bootstrap values.
      recurrent-ppo-v2-warm-boundary-state: Recurrent PPO with corrected time-limit bootstrap and exact stored LSTM state restoration at every ordinary or warm-prefix episode boundary inside each replay chunk.
  optimization-schedule:
    versions:
      frozen-policy: No optimizer updates; evaluate the promoted checkpoint unchanged.
      default-ppo: All trainable parameters update from the first PPO update.
      A8-staged: Freeze the A2 base for ten updates, then jointly optimize.
      A8-horizon-continuation: Resume the qualified 30,720-transition A2 and A8 states and extend both to 250,880 transitions without resetting optimizer or RNG state.
      250880-transition-single-seed: Warm-start non-critic A2 weights, reset critic/optimizer/RNG, and train one full 250,880-transition causal replication.
      boss-curriculum-function-preserving-a2-vs-a8-v1: Fine-tune function-identical A2 and zero-projected A8 policies on the same finite boss curriculum, with A8 base weights frozen for its first ten updates.
      single-boss-assisted-a2-v1: Warm-start the A2 encoder, recurrent policy, and actor from the corrected promoted checkpoint while resetting critic and optimizer, then train three independent 51,200-transition trials on one assisted boss distribution.
      assistance-reduction-with-replay-v1: First test frozen transfer to reduced player-health assistance; only if it fails, fine-tune three independent trials on the predeclared harder-to-mastered reset mixture with a fresh optimizer.
      A2-to-A8-actor-parity-fresh-critic-v2: Copy the complete A2 actor and recurrent function into zero-projected A8, retain exact initial action logits and recurrent state, initialize a fresh A8 critic and optimizer, freeze only inherited actor/recurrent base parameters for ten updates while training the fresh critic from update zero, then optimize jointly.
      A8-phase3-successor-fresh-critic-v1: Preserve the exact A8 actor and recurrent function from the legal EXP-0022 guide, reset critic and optimizer for the phase-3 value distribution, freeze inherited actor/recurrent base parameters for ten updates, then optimize jointly.
      A8-full-boss-v5-fresh-critic-v1: Preserve the exact A8 actor and recurrent function from EXP-0022 seed-86002, reset critic and optimizer for terminal-canceling full-boss returns, freeze inherited actor/recurrent base parameters for ten updates, then optimize jointly.
  training-level-distribution:
    versions:
      unbounded-random-v1: Each worker samples fresh 31-bit procedural seeds from an independent deterministic stream.
      uniform-finite-pool-v1: Each worker samples from one declared finite seed pool; independent streams and exact next-draw state are checkpointed.
      reverse-curriculum-sequential-goto-v1: Finite-pool training starts at a declared later real-game sequential level, then expands starts backward while final evaluation remains normal-start.
      mixed-curriculum-replay-v1: Each worker draws a checkpointed weighted per-episode reset specification, allowing a harder start distribution to retain a declared fraction of mastered starts without actor-timing bias; infrastructure recovery replays the same task and seed.
      prioritized-level-replay-v1: Planned finite-pool replay weighted by measured learning potential; not yet implemented or authorized for an experiment.
      legal-natural-prefix-phase3-v2: A frozen stochastic guide reaches an observed legal Death Metal phase-3 state through ordinary live actions; guide transitions are excluded and PPO collects a contiguous learner fragment from the exact handoff with warmed recurrent state.
      adaptive-competence-replay-v3:
        description: Ordered legal boundaries use infrastructure-excluding rolling gameplay outcomes and Wilson confidence bounds to promote or demote difficulty, while deterministic per-worker sampling reserves explicit mass for current acquisition, mastered-boundary replay, and frontier probes; scheduler windows, counters, active boundary, allocation, and RNG streams resume exactly.
        config: configs/adaptive-curriculum-zone2-v1.json
        config_sha256: 6e14e4a07ff36130036b1a4140084d58eb18c5b7d6ac237ed971e4fa02302c6f
      qualified-trace-tail-v4: Fresh-launch replay-qualified successful action sequences execute through the live controller to a hash-identified observation boundary; guide actions remain outside PPO, the learner recurrent state is warmed from actual observations and stable feedback, and a declared final action tail is learned on-policy before the handoff expands backward.
      qualified-trace-tail-v5: A declared source checkpoint is first evaluated through the exact qualified live prefix, and training begins at a one-action tail only when gameplay completion lies inside the predeclared intermediate-competence band; later expansion remains gated on frozen-policy outcomes.
      qualified-trace-tail-v6: A declared ascending tail grid is evaluated through exact qualified live prefixes under deterministic and multiple fixed stochastic policy streams; the shortest boundary in the 10--90 percent competence band is selected before PPO, while every easier or harder calibration result remains immutable lineage evidence.
      qualified-trace-tail-v7: Extend live boundary calibration from the saturated final-16 region toward the near-full boss start using predeclared four-action increments through tail 80 plus the maximum legal tail 81, with a 128-turn learner cap and the same exact replay and recurrent-state contract.
      qualified-trace-window-v8: Uniformly retain the accepted tail-32 handoff while adding every calibrated four-action boundary through the next intermediate-competence frontier; per-slot episode counters select the window without actor-timing bias and resume exactly.
      qualified-trace-window-v9: Retain every accepted handoff in the complete tail-32-through-tail-36 window while calibrating and adding every four-action boundary through the next intermediate-competence frontier; all retained starts remain independently evaluable.
      qualified-trace-window-v10: Retain the complete tail-32-through-tail-40 window, expand through the next measured frontier, and require at least two independent optimizer trials to preserve every retained boundary before selecting a source checkpoint.
      qualified-trace-window-v11: Retain and independently score every accepted or saturated boundary in the complete tail-32-through-tail-48 training window, including intermediate tail 44, then expand to the next measured frontier while requiring at least two independent optimizer trials to preserve the whole window.
      reverse-forward-composition-v12: Mix trace-qualified downstream replay with prefix-free upstream resets using independent finite seed pools per reset specification; trace replay is eligible only for an exact qualified reset-and-seed pair, and every curriculum and seed RNG stream resumes exactly.
      qualified-trace-window-v13: Retain and independently score every four-action boundary in the complete tail-32-through-tail-52 window, then expand to the next measured frontier while requiring at least two independent optimizer trials to preserve the whole window.
  data-selection:
    versions:
      disclosed-qualified-training-traces-v1: Successful trajectories are searched only on a predeclared training seed bank, hash-bound to their reports and action contract, replay-qualified on fresh live launches, and required to cover at least three distinct seeds; held-out seeds never enter the bank.
  runtime:
    versions:
      historical-sync: Earlier synchronous or partially synchronous live collection.
      async-native-pipe-v1: Versioned asynchronous native-pipe actor collection.
  evaluation:
    versions:
      heldout-live-v1: Deterministic held-out live-game episodes with gameplay metrics.
      schema10-async-v1: Qualified asynchronous deterministic evaluation.
      schema10-stochastic-v1: Qualified asynchronous evaluation with timing-independent, seed-reproducible samples from the trained categorical policy alongside argmax control runs.
      deterministic-plus-turn-keyed-stochastic-v2: Corrected-metric evaluation using argmax and two reproducible sampled-policy streams with explicit descent and item/currency attribution.
      action-outcome-contract-v3: V2 evaluation plus authoritative action-outcome counts, wall-attempt rate, learned invalid-wall signatures, and effective-mask diagnostics.
      map-navigation-contract-v4: Action-outcome evaluation plus navigation-prior activation, effective directional masking, staircase conversion, traversal diversity, and valid-cycle diagnostics.
      curriculum-feasibility-v5: Frozen-policy evaluation from a declared real-game sequential level with explicit target completion, corrected level-pair metrics, and normal-start evidence kept separate.
      boss-curriculum-learning-v6: Held-out boss-start evaluation across deterministic and two turn-keyed stochastic policy streams, with Zone 2 entry as the sole success event.
      single-boss-assisted-v7: Evaluate deterministic and turn-keyed stochastic policies on a predeclared, telemetry-selected held-out set of one boss type; report distinct successful seeds, completion rate/time, boss attribution, deaths, and controller validity separately from shaped return.
      assistance-transfer-and-retention-v8: Gate reduced-assistance transfer on fresh single-boss seeds, then if optimization is required evaluate both the harder profile and matched-seed mastered-profile retention under deterministic and turn-keyed stochastic control.
      legal-death-metal-guide-v9: On disjoint telemetry-confirmed Death Metal seeds, score authoritative boss phase depth, phase-4 acquisition, damage, deaths, and Zone 2 entry under deterministic and two turn-keyed stochastic modes; acquisition failures remain in the denominator.
      legal-death-metal-guide-v10: V9 evaluation plus zero-contact timeout, wait, movement, and action-distribution diagnostics for the outcome-aligned guide reward.
      legal-phase3-successor-v11: Evaluate exact-guide phase-3 acquisition and learner Zone 2 entry separately, retain failed acquisitions in the unconditional denominator, and report conditional completion only alongside acquisition and distinct-seed coverage.
      legal-full-boss-potential-v12: Evaluate untouched player20 Death Metal from its full-health start under deterministic and two turn-keyed stochastic modes, selecting only by live Zone 2 entry, distinct held-out seeds, phase depth, deaths, and controller validity.
      conditional-trace-tail-v13: Evaluate frozen final checkpoints only on post-handoff learner actions after a fresh replay-qualified live prefix, under deterministic and predeclared stochastic modes; require multi-seed and multi-optimizer conditional Zone 2 entry before expanding the boundary, while keeping training-curve and unassisted promotion evidence separate.
      conditional-trace-tail-v14: Add a hash-bound source-checkpoint gameplay calibration matrix before training, require the selected boundary to fall inside the 10--90 percent competence band, then retain the conditional multi-seed and multi-optimizer frozen-policy expansion gate.
      conditional-trace-tail-v15: Select a live learner boundary from a predeclared ascending tail grid using a larger fixed source-policy calibration matrix, then evaluate frozen final policies on every qualified seed under deterministic and two fixed stochastic modes; assisted completion can advance only the reverse curriculum and never counts as normal-start promotion.
      conditional-trace-tail-v16: Preserve v15's frozen conditional gate while expanding source calibration into the near-full boss region and raising the learner cap to 128 turns so the calibration cannot manufacture failure by truncating longer valid continuations.
      conditional-trace-window-v17: Evaluate both the retained tail-32 boundary and the newly selected harder boundary under deterministic and two fixed stochastic modes, requiring reproducible expansion without lowering retained completion below 80 percent.
      conditional-trace-window-v18: Evaluate every retained boundary and the newly selected harder boundary separately under deterministic and two fixed stochastic modes, requiring each retained boundary to remain at least 80 percent successful rather than permitting aggregate retention to hide forgetting.
      conditional-trace-window-v19: Preserve v18's per-boundary evaluation and additionally require at least two independently trained checkpoints to score at least 80 percent on every retained boundary, preventing a single lucky retention-eligible model from authorizing expansion.
      conditional-trace-window-v20: Extend v19 retention to every state included in the accepted training window, so saturated intermediate calibration boundaries cannot disappear merely because they were not the selected frontier.
      conditional-trace-window-v21: Extend complete-window retention through tail 52 and independently score the next calibrated frontier under deterministic and two turn-keyed stochastic policies; only a pass at tail 81 authorizes a prefix-free full-boss experiment.
