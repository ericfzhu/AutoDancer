frozen_transfer_gate:
  candidate_seed_range: 72001-72256
  heldout_selection: ascending first 24 telemetry-confirmed Death Metal seeds
  profile: boss1hp-player6
  modes: [deterministic, stochastic-103001, stochastic-103002]
  max_turns: 500
  pass_rule: sampled completion at least 50 percent, at least 12 distinct successful seeds, sampled death at most 50 percent, deterministic completion at least 20 percent, exact controller validity, and zero restarts
  action_if_passed: retain the frozen parent and advance to separately versioned boss-health assistance removal
  action_if_failed: consume these seeds as development and run the fixed mixed-replay trials
training:
  conditional: run only if the frozen transfer gate fails
  source_checkpoint: runs/assisted-death-metal/training/seed-68002/final.pt
  curriculum_config: configs/curriculum-exp0018-player6-replay.json
  curriculum_config_sha256: bad1e38d2119116bcb95ed6ae1083acb6a2865449e8f3decb43ddf7e0b938d24
  training_seeds: [73001, 73002, 73003]
  game_seed_pool: [64001, 64002, 64012, 64013, 64016, 64018, 64020, 64026, 64027]
  workers: 8
  transition_budget_per_trial: 51200
  max_turns: 500
evaluation:
  first_stage: frozen gate on the first 24 Death Metal seeds in 72001-72256
  conditional_acceptance_stage: matched player6 and player10 evaluation on fresh Death Metal seeds in 74001-74256
  primary_outcome: live entry to Zone 2 Floor 1
  modes: [deterministic, two timing-independent stochastic streams]
decision_rule: Run the frozen gate first. If it passes, skip optimization and accept removal of player-health assistance. If it fails, accept a mixed-replay checkpoint only when fresh player6 sampled completion is at least 50 percent with improvement in two of three trials and player10 retention is at least 80 percent of the matched parent; otherwise retain the parent and add an intermediate health profile. Never change reward or architecture based on this result.
