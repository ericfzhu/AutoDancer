schema_version: 1
id: EXP-0018
title: Normal Bard-health one-hit boss transfer
question: Does the accepted EXP-0017 policy retain repeatable Death Metal completion when player-health assistance is fully removed, and if not, can calibrated mastered-start replay consolidate it?
hypothesis: The one-hit finishing policy has already learned enough local combat to transfer to Bard's normal six health on fresh seeds; if that boundary is marginal, an 80/20 player6-to-player10 mixture will consolidate it without forgetting.
changed_blocks: [environment-semantics, optimization-schedule, training-level-distribution, evaluation]
component_versions:
  reward: V4A
  architecture: A2
  observation: schema10-corrected-memory-boss
  controller: schema10-requalified-current-hashes
  environment-semantics: mixed-assisted-curriculum-v3
  learner-diagnostics: boss-objective-v3
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: assistance-reduction-with-replay-v1
  training-level-distribution: mixed-curriculum-replay-v1
  runtime: async-native-pipe-v1
  evaluation: assistance-transfer-and-retention-v8
invariants:
  - the EXP-0017-selected checkpoint is unchanged from seed-68002 and is the only parent
  - Bard normal seeded All Zones identity is followed by real-game sequential GOTO to Zone 1 Floor 4
  - player6 is Bard's normal health; the boss objective alone remains one-hit assisted
  - setup assistance emits no transition or reward and success requires live entry to Zone 2 Floor 1
  - all seeds are telemetry-confirmed Death Metal and the fresh transfer suite is evaluated once
  - exactly eight qualified fixed-capacity workers, zero infrastructure contamination, and exact identity validation are required
  - if optimization is needed, every trial uses the same 80 percent player6 / 20 percent mastered player10 distribution
  - gameplay completion, death, and retention decide; shaped return never does
  - no one-hit boss result constitutes unassisted boss or normal-start Zone 2 evidence
arms:
  - id: frozen-player6-transfer
    description: Evaluate the unchanged selected parent on fresh normal-health, one-hit Death Metal starts before any optimizer update.
    component_versions:
      environment-semantics: assisted-single-boss-curriculum-v2
      optimization-schedule: frozen-policy
      training-level-distribution: reverse-curriculum-sequential-goto-v1
  - id: mixed-player6-replay
    description: Conditional three-trial fine-tuning using 80 percent player6 and 20 percent mastered player10 starts.
    component_versions:
      environment-semantics: mixed-assisted-curriculum-v3
      optimization-schedule: assistance-reduction-with-replay-v1
      training-level-distribution: mixed-curriculum-replay-v1
calibration:
