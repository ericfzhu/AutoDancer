  controller_qualification_sha256: 126533ab66c31b699709c6e32bfaf9099fbeb4e96b651c68f1f6d602b8572888
  resume: exact model, critic, optimizer, global step, update count, and RNG states
  ppo:
    rollout_length: 128
    sequence_length: 32
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    learning_rate: 0.0003
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    update_epochs: 4
    minibatch_chunks: 8
evaluation:
  deterministic: true
  shaped_return_selects_policy: false
  seeds: 56001-56016
  max_turns: 3000
  checkpoints: [30720, 61440, 122880, 250880]
  metrics:
    - mean floor progress
    - staircase discovery and exit
    - death and step-limit rates
    - kills and item pickups per episode
    - unique positions and unchanged-position rate
  follow_up_if_passed: Three fresh training seeds and 64 new held-out seeds are a separate confirmation experiment.
decision_rule: Advance A8 only if all reports and controller/training health are valid, the rich groups remain material, A8 beats equally continued A2 at two consecutive extended checkpoints including the final checkpoint, final A8 progress strictly beats both A2 controls, and final safety and local competence remain within the declared bounds. A final-only advantage is inconclusive and requires a predeclared replication; no final advantage retains A2 and rejects A8 under Reward V2 at this horizon.
