schema_version: 1
id: EXP-0008
title: Architecture 8 training-horizon test
question: Does A8's rich-observation residual develop a repeatable held-out progression advantage over equally continued A2 when adaptation is extended from 30,720 to 250,880 transitions?
hypothesis: A8 learns more slowly than its A2 base; with a longer horizon its held-out floor progress and staircase behavior will improve across checkpoints while preserving A2-level safety and local competence.
changed_blocks: [optimization-schedule]
component_versions:
  reward: V2
  architecture: [A2, A8]
  observation: [legacy-A2, schema9-rich]
  controller: schema10-qualified
  action-contract: current-11
  algorithm: recurrent-ppo-v1
  optimization-schedule: A8-horizon-continuation
  runtime: async-native-pipe-v1
  evaluation: schema10-async-v1
invariants:
  - Bard normal seeded All Zones
  - eight fixed-capacity workers
  - qualified schema-10 controller and repository mod
  - Reward V2 and the current eleven-action contract
  - recurrent PPO hyperparameters from EXP-0007
  - identical training seed, continuation budget, and evaluation seeds for both trainable arms
  - no reward, observation, architecture, action, or controller changes relative to EXP-0007
arms:
  - id: a2-frozen
    description: Evaluate the promoted A2/V2 source checkpoint without optimizer updates.
    component_versions:
      architecture: A2
      observation: legacy-A2
      optimization-schedule: frozen-policy
  - id: a2-continuation
    description: Resume EXP-0007's A2 fine-tune checkpoint at 30,720 transitions with exact optimizer and RNG state and continue to 250,880.
    component_versions:
      architecture: A2
      observation: legacy-A2
      optimization-schedule: A8-horizon-continuation
  - id: a8-continuation
    description: Resume EXP-0007's A8 checkpoint at 30,720 transitions with exact optimizer and RNG state and continue joint training to 250,880.
    component_versions:
      architecture: A8
      observation: schema9-rich
      optimization-schedule: A8-horizon-continuation
training:
  seed: 51001
  workers: 8
  device: cuda
  start_step: 30720
  final_step: 250880
  checkpoint_steps: [30720, 61440, 122880, 250880]
