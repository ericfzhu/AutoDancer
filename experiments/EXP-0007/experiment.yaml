  controller_qualification: runs/controller-qualification/qualification.json
  controller_qualification_sha256: 126533ab66c31b699709c6e32bfaf9099fbeb4e96b651c68f1f6d602b8572888
  initialization: preserve complete source function and critic; reset optimizer
  failure_policy: preserve completed stages, but any controller restart or invalid lineage fails the gate
evaluation:
  deterministic: true
  shaped_return_selects_policy: false
  curve:
    seeds: 52001-52016
    max_turns: 1500
    checkpoints: [0, 10240, 20480, 30720]
  broad:
    seeds: 53001-53030
    max_turns: 3000
  confirmation_if_passed:
    training_seeds: [54001, 54002, 54003]
    heldout_seeds: 55001-55064
    max_turns: 5000
decision_rule: A8 first needs exact parity, material use of all new groups, healthy training/evaluation, at least 90 percent of fine-tuned-A2 curve progress, death and step-limit rates within ten points, and at least 60 percent of its kills/items. Broad evaluation then requires progress strictly above frozen and fine-tuned A2, death within five points of fine-tuned A2, at least 80 percent of its kills/items, and no worse step-limit or unchanged-position rate. Passing advances A8 to a separate three-seed confirmation; it does not promote A8 directly. Failure retains A2.
