schema_version: 1
id: EXP-0007
title: Qualified Architecture 8 replication
question: Does the A8 zero-projected residual convert schema-9 rich observations into better held-out gameplay while preserving A2 competence under the qualified controller?
hypothesis: A8 will preserve A2 exactly at initialization, learn material influence from all four new observation groups, and beat frozen and ordinarily fine-tuned A2 on held-out floor progress without violating safety or competence gates.
changed_blocks: [architecture, observation, optimization-schedule]
component_versions:
  reward: V2
  architecture: [A2, A8]
  observation: [legacy-A2, schema9-rich]
  controller: schema10-qualified
  action-contract: current-11
  algorithm: recurrent-ppo-v1
  optimization-schedule: [frozen-policy, default-ppo, A8-staged]
  runtime: async-native-pipe-v1
  evaluation: schema10-async-v1
invariants:
  - Bard normal seeded All Zones
  - eight fixed-capacity workers
  - qualified schema-10 controller and repository mod
  - Reward V2 config and source checkpoint
  - current eleven-action contract
  - recurrent PPO hyperparameters
  - identical training seed and budgets for trainable arms
arms:
  - id: a2-frozen
    description: Evaluate the promoted A2/V2 checkpoint without optimizer updates.
    component_versions:
      architecture: A2
      observation: legacy-A2
      optimization-schedule: frozen-policy
  - id: a2-finetune
    description: Fine-tune the complete A2/V2 policy under the current action contract.
    component_versions:
      architecture: A2
      observation: legacy-A2
      optimization-schedule: default-ppo
  - id: a8-candidate
    description: Preserve A2 under a zero-initialized 512x512 rich-observation residual; freeze the base for ten updates and then train jointly.
    component_versions:
      architecture: A8
      observation: schema9-rich
      optimization-schedule: A8-staged
training:
  source_checkpoint: runs/reward-v2-250k/final.pt
  source_checkpoint_sha256: 9fa39f242995555a8b9b3c9556253d0c7ab19945e9cb80292bf312388d6eda5d
  reward_config: configs/reward-v2.json
  reward_config_sha256: 84494b038f1d6c8e144d72e84dbca7227de2881f5ab8973b384758d7aff53b12
  seed: 51001
  workers: 8
  device: cuda
  trainable_arm_steps: 30720
  checkpoint_steps: [10240, 20480, 30720]
  a8_base_frozen_updates: 10
  affinity_policy: none
  timeouts_seconds: {startup: 60, action: 30, reset: 60}
  ppo:
    rollout_length: 128
    sequence_length: 32
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    learning_rate: 0.0003
    entropy_coef: 0.01
