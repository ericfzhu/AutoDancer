  training_seeds: [76001, 76002, 76003]
  game_seed_selection: ascending first 24 telemetry-confirmed Death Metal seeds in 75301-75556
  workers: 8
  transition_budget_per_trial: 51200
  max_turns: 500
evaluation:
  conditional_acceptance_seed_range: 77001-77256
  heldout_selection: ascending first 24 telemetry-confirmed Death Metal seeds
  profiles: [boss1hp-player8, boss1hp-player10]
  modes: [deterministic, stochastic-107001, stochastic-107002]
  primary_outcome: live entry to Zone 2 Floor 1
  pass_rule: mean trained player8 sampled completion at least 60 percent, at least two trials improve over the matched parent, and at least one healthy checkpoint has player8 completion at least 60 percent, player8 death at most 40 percent, and player10 retention at least 80 percent of the parent
decision_rule: Run the frozen gate first. If it passes, skip optimization. If it fails, accept the mixed arm only when every aggregate and individual reproducibility gate passes on the fresh final seed set. A passing result authorizes a separately declared player8-to-player6 transfer; otherwise retain the EXP-0017 parent and investigate adaptive level sampling without changing reward or architecture in this experiment.
