schema_version: 1
id: EXP-0019
title: Stable player8 bridge stage
question: Can an intermediate eight-health Death Metal curriculum establish a reproducible bridge between the mastered player10 policy and normal six-health play?
hypothesis: The direct player10-to-player6 transfer crossed a sharp survivability boundary and produced high trial variance; reducing assistance first to player8 will keep enough successful trajectories for three independent PPO trials to consolidate the skill before a separately declared player8-to-player6 transfer.
changed_blocks: [environment-semantics, optimization-schedule, training-level-distribution, evaluation]
component_versions:
  reward: V4A
  architecture: A2
  observation: schema10-corrected-memory-boss
  controller: schema10-requalified-current-hashes
  environment-semantics: mixed-assisted-curriculum-v3
  learner-diagnostics: boss-objective-v3
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: assistance-reduction-with-replay-v1
  training-level-distribution: mixed-curriculum-replay-v1
  runtime: async-native-pipe-v1
  evaluation: assistance-transfer-and-retention-v8
invariants:
  - the accepted EXP-0017 seed-68002 checkpoint is the only parent; EXP-0018 seed-73002 is diagnostic evidence and is not promoted
  - Bard normal seeded All Zones identity is followed by real-game sequential GOTO to Zone 1 Floor 4
  - player8 changes only starting player health; the boss objective remains one-hit assisted
  - setup assistance emits no transition or reward and success requires live entry to Zone 2 Floor 1
  - calibration, training, and final evaluation use disjoint telemetry-confirmed Death Metal seed sets
  - exactly eight workers under the fresh player8 controller qualification are required with zero natural infrastructure contamination
  - conditional optimization uses exactly 80 percent player8 and 20 percent mastered player10 episodes in every trial
  - gameplay completion, death, and mastered-skill retention decide; shaped return never does
  - no one-hit boss result constitutes unassisted boss or normal-start Zone 2 evidence
arms:
  - id: frozen-player8-transfer
    description: Evaluate the unchanged EXP-0017 parent on fresh player8 one-hit Death Metal starts before any optimizer update.
    component_versions:
      optimization-schedule: frozen-policy
      training-level-distribution: reverse-curriculum-sequential-goto-v1
  - id: mixed-player8-replay
    description: If frozen transfer fails, fine-tune three independent trials on 80 percent player8 and 20 percent mastered player10 starts using a 24-seed training pool.
    component_versions:
      optimization-schedule: assistance-reduction-with-replay-v1
      training-level-distribution: mixed-curriculum-replay-v1
source:
