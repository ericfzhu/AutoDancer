frozen_transfer_gate:
  candidate_seed_range: 75001-75256
  heldout_selection: ascending first 24 telemetry-confirmed Death Metal seeds
  profile: boss1hp-player8
  modes: [deterministic, stochastic-106001, stochastic-106002]
  max_turns: 500
  pass_rule: sampled completion at least 60 percent, at least 16 distinct successful seeds, sampled death at most 40 percent, deterministic completion at least 33 percent, exact controller validity, and zero restarts
  action_if_passed: accept player8 as the stable bridge without optimization and declare a separate player8-to-player6 experiment
  action_if_failed: consume these seeds as development and run the fixed mixed-player8 replay trials
training:
  conditional: run only if the frozen player8 gate fails
  source_checkpoint: runs/assisted-death-metal/training/seed-68002/final.pt
  curriculum_config: configs/curriculum-exp0019-player8-replay.json
