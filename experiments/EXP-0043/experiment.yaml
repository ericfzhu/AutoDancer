decision_rule: Report qualification and handoff gates, conditional success separately
  by tail/seed, all direct wins/contact/damage and deaths versus frozen source and
  EXP-0041 control, measured update stability, and prefix-inclusive elapsed time.
  No promotion. No direct completion improvement means transfer remains unproven even
  if assisted success is high. Finish this bounded comparison without launching an
  open-ended sweep.
