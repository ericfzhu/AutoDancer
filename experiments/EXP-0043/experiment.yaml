schema_version: 1
id: EXP-0043
title: Bounded legal trace curriculum and direct-start transfer
question: Does near-success practice with stable PPO yield successful learning and
  transfer to direct starts?
hypothesis: Qualified reachable starts provide success experience missing from direct
  training, but may overfit the two familiar maps.
changed_blocks:
- training-level-distribution
- evaluation
component_versions:
  training-level-distribution: bounded-two-trace-window-v1
  evaluation: bounded-curriculum-transfer-v1
  action-contract: bounded-bard-navigation-v1
  observation: bounded-bard-controls-v1
  architecture: A8
  reward: DeathMetalPotentialV5
  optimization-schedule: bounded-low-step-v1
  controller: schema10-bounded-refresh-v1
invariants:
- No reward, architecture, control, optimizer-setting or checkpoint sweep; no promotion
  or final-test gameplay.
- Source is the EXP-0041 saved initial learner; require model tensors bitwise equal
  to historical original source, preserving actual metadata rather than editing checkpoint
  identity.
- Derive a new bank only from EXP-0042 successfully current-mask-replayed traces;
  bind original bank, result and manifest. Do not alter historical actions or rejected
  trace. Freshly replay and capture both included traces before handoff evaluation.
- Require both fresh traces valid, no restart or infrastructure fault, exact observation
  digests and valid recurrent handoffs. If qualification fails, stop dependent training.
- Before training require at least one successful frozen continuation across the eight
  declared conditional episodes; otherwise report failed acquisition gate without
  training. Do not tune tails from results.
- One optimizer seed 217001; 16384 transitions and 16 updates; eight workers; same
  PPO settings as EXP-0041 (rate 3e-6, target KL .02), original source weights and
  fresh optimizer.
- Two training seeds 92008 and 92096; balanced tails 32 and 60; player20 level4 to5;
  500 learner turns; online recurrent warmup. Prefix acquisition time counts in elapsed
  training time.
- Ten-minute fresh replay cap, ten-minute per evaluation invocation, thirty-minute
  training cap, sixty-minute total cap. Hash drift, unsupported loadout, recovery,
  replay disagreement or nonfinite metrics invalidate execution.
- Historical EXP-0041 control uses different training seed distribution by design;
  this is a curriculum package comparison, not an isolated causal effect of start
  distance. Two historical successful seeds are selected demonstrations, not representative
  maps.
arms:
- id: frozen
  description: Original weights, eight conditional source episodes and reused direct
    reference.
- id: curriculum
  description: Balanced two-trace tails, final conditional and direct evaluation.
