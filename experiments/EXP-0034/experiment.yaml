  modes: [deterministic, stochastic-98001, stochastic-98002]
  learner_turn_cap: 128
  retained_boundaries: [32, 36, 40, 44, 48, 52]
  expanded_boundary: selected by calibration
  minimum_retention_eligible_trials: 2
  primary_outcome: conditional live Zone 2 entry at the selected expanded boundary
  retention_outcome: conditional live Zone 2 entry at every state in the accepted training window
decision_rule: Accept the expansion only if the selected harder boundary aggregates at least 10 percent completion, at least two trials reach 5 percent, every trial completes at least once, all three trace seeds complete, every retained boundary independently aggregates at least 80 percent success, at least two trials each score at least 80 percent on every retained boundary, losses are finite, and training plus evaluation have zero controller restarts. A pass below tail 81 authorizes another retained-window expansion; a pass at tail 81 authorizes a separately registered prefix-free full-boss test. No assisted outcome is normal-start promotion.
