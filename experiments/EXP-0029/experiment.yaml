schema_version: 1
id: EXP-0029
title: Expanded live Death Metal competence-boundary acquisition
question: Does the frozen source policy expose an informative replay-qualified boundary between 20 learner actions and the maximum legal 81-action tail, and can recurrent PPO improve from that boundary?
hypothesis: EXP-0028 established that every final-1 through final-16 boundary is saturated at 15/15 source completions. Moving the learner start backward in four-action increments toward the full boss state should reveal a 10--90 percent competence boundary; a 128-turn cap prevents longer continuations from being mislabeled as failures.
changed_blocks: [training-level-distribution, evaluation]
component_versions:
  reward: DeathMetalPotentialV5
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-requalified-current-hashes
  environment-semantics: player-health-only-boss-curriculum-v4
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v2-warm-boundary-state
  training-level-distribution: qualified-trace-tail-v7
  data-selection: disclosed-qualified-training-traces-v1
  runtime: async-native-pipe-v1
  evaluation: conditional-trace-tail-v16
invariants:
  - calibration tests tails 20 through 80 in four-action increments, followed by maximum legal tail 81, and selects the shortest boundary inside the 10--90 percent live completion band
  - every candidate uses deterministic execution plus fixed stochastic policy seeds 98001 through 98004 on all three qualified game seeds
  - every calibration and evaluation episode permits 128 learner turns, exceeding every qualified source trace length
  - worker 0 alone initializes Steam presence; exact parity with Steam-disabled gameplay was established before this experiment
  - no optimizer transition is spent unless a complete controller-valid candidate matrix identifies an intermediate boundary
  - every prefix starts from a fresh legal player20 full-boss reset and replays acknowledged live actions with exact qualified observation digests
  - guide actions warm the learner recurrent state and stable reward feedback but never enter PPO
  - every warm handoff is an episode boundary whose collected LSTM state is restored during PPO replay
  - all 930xx EXP-0024 held-out seeds remain excluded from calibration, training, and trace acquisition
  - assisted trace-tail completion never counts as normal-start Zone 2 evidence
  - exactly eight fixed-capacity workers and zero infrastructure contamination are required
arms:
  - id: a8-expanded-trace-tail
    description: Three A8 PPO replications train from the shortest expanded replay-qualified tail inside the frozen source policy's measured intermediate-competence band.
