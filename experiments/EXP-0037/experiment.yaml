schema_version: 1
id: EXP-0037
title: Frozen bounded navigation assistance comparison
question: Does restoring navigation assistance improve direct-start performance of
  the frozen source under corrected dagger controls?
hypothesis: Navigation assistance reduces wall attempts and increases boss contact;
  combat success is evaluated separately.
changed_blocks:
- action-contract
- evaluation
component_versions:
  observation: bounded-bard-controls-v1
  action-contract: bounded-bard-v1
  evaluation: bounded-navigation-ablation-v1
  controller: schema10-bounded-refresh-v1
  architecture: A8
  reward: DeathMetalPotentialV5
invariants:
- Original EXP-0036 source checkpoint, not its fine-tuned final checkpoint; no optimizer,
  guide actions, architecture or reward changes.
- Exactly eight workers, Bard player20, direct level 4 to level 5, 500 turns, fixed
  24 seeds and two stochastic policy streams; no final-test gameplay.
- Reuse the 48 completed EXP-0036 frozen control episodes, binding their reports and
  original source manifest. The only changed runtime Python source allowed for reuse
  is the additive action-contract wrapper; all other runtime Python and Lua hashes
  must match.
- Refresh scoped live mechanics qualification and pass targeted contract tests before
  evaluation. The new wrapper delegates navigation to dagger-controls-v1; the old
  no-navigation contract is retained.
- Whole new evaluation has a twenty-minute hard cap, each stream ten minutes. Source
  drift, unexpected equipment, infrastructure errors or incomplete seed coverage invalidates
  the attempt with no seed replacement.
- Navigation assistance includes learned invalid-wall masking and the existing exploration/stair
  prior; this experiment does not attribute their effects separately.
