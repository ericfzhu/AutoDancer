decision_rule: Diagnostic only, no policy promotion. A reduction in wall attempts
  together with positive boss damage supports navigation dependence. Completion is
  reported independently; zero completions does not establish learning inability.
  Any scope, controller, source or budget failure invalidates the new arm. Always
  record the paired results without selecting seeds or checkpoints.
