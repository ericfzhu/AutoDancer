  global_step: 61440
evaluation:
  game_seeds: 61001-61024
  max_turns: 5000
  workers: 8
  execution_trials:
    - mode: deterministic
      policy_seed: 0
    - mode: stochastic
      policy_seed: 93001
    - mode: stochastic
      policy_seed: 93002
  primary_outcome: normal-start floor and zone progress on unseen seeds
  diagnostics:
    - authoritative action-outcome counts and wall-attempt rate
    - learned wall signatures and mean masked directions
    - step limits, deaths, unchanged-position turns, and unique positions
    - kills, item pickups, staircase discovery, and floor exits
decision_rule: The mask passes the inference ablation only if unit and live evidence show zero suppression of productive combat or digging, its three-trial aggregate reduces wall-attempt rate by at least 75%, reduces step-limit rate, does not reduce mean floor progress, retains at least 80% of current-contract kills and item pickups, and improves action efficiency in at least two of three policy modes. Passing authorizes a separately predeclared same-seed PPO training comparison; it does not itself promote a policy.
