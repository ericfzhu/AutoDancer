decision_rule: Diagnostic only; no promotion. Development completion improvement of
  at least 0.10 with nondecreasing training completion motivates replication. Otherwise
  report paired boss damage, contact, deaths and wall attempts as inconclusive. Any
  scope, controller, numeric, source or budget failure invalidates the attempt. Never
  select an intermediate checkpoint or substitute seeds.
