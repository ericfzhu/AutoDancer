  reward: DeathMetalPotentialV5
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-qualified
  environment-semantics: player-health-only-boss-curriculum-v4
  learner-diagnostics: boss-objective-v3
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: A8-full-boss-v5-fresh-critic-v1
  training-level-distribution: reverse-curriculum-sequential-goto-v1
  runtime: async-native-pipe-v1
  evaluation: legal-full-boss-potential-v12
invariants:
  - the exact passed eight-worker one-million-transition controller qualification is required before training
  - Bard begins from normal seeded All Zones followed by real-game sequential GOTO to Zone 1 Floor 4
  - player20 changes only Bard's current and maximum health; boss and boss-add state remains untouched
  - every game action after reset is selected by the frozen rollout version of the learner and enters its contiguous on-policy fragment
  - no guide, demonstration, snapshot restoration, fabricated state, or direct boss mutation is used
  - visible boss-health reduction from the real full-health start defines the bounded state potential and credits direct weapons and bombs equally
  - direct boss damage, boss kill, ordinary enemy, survival, and death shaping are zero
  - failed partial progress is terminally canceled; a client time limit retains potential and bootstraps because it is not an MDP terminal
  - real floor and zone completion remain task reward and shaped return never selects a checkpoint
  - source actor, recurrent transition, and logits are preserved while critic, optimizer, episode state, and RNG are fresh
  - the inherited actor base is frozen for exactly ten PPO updates and then jointly optimized
  - calibration, training, and evaluation banks are disjoint and calibration observes boss identity only
  - every selected seed is telemetry-confirmed Death Metal and every held-out seed remains in the denominator
  - exactly eight fixed-capacity workers, one policy version per rollout, and zero natural infrastructure contamination are required
  - player20 full-boss success is downstream acquisition evidence only and does not count as normal-start Zone 2
