schema_version: 1
id: EXP-0024
title: Full-boss terminal-canceling Death Metal acquisition
question: Can the best EXP-0022 A8 policy learn repeatable untouched Death Metal clears when all full-boss actions are on-policy learner transitions and failed partial boss progress has zero discounted shaping return?
hypothesis: EXP-0022 already supplies contact, phase-3 behavior, and one legal clear, while EXP-0023 proves guide-gated collection is operationally unusable. Warm-starting that policy on full player20 Death Metal under visible-health PBRS should preserve its local competence, remove the return incentive for damage-then-die farming, and increase held-out Zone 2 entries without discarding guide actions.
changed_blocks: [reward, optimization-schedule, evaluation]
