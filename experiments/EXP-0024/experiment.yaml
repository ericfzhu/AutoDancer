decision_rule: Accept only if the three-final aggregate live Zone 2 entry rate is at least 10 percent, at least two trials enter Zone 2 on at least 5 percent of held-out episodes, at least six distinct held-out game seeds complete across trials, every trial completes at least one seed, aggregate mean phase depth and completion rate both improve over the matched source, and all controller invariants hold. Rank passing trials lexicographically by distinct Zone 2 seeds, completion rate, mean phase depth, death rate, then turns. A pass authorizes a separately declared player-health contraction with mastered full-boss replay; a failure rejects full-boss V5 at this source and requires a more sample-efficient skill-learning mechanism rather than more shaping. No result is normal-start promotion.
