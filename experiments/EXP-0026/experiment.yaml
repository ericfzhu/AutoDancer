schema_version: 1
id: EXP-0026
title: Live-calibrated one-action Death Metal trace-tail acquisition
question: Can recurrent PPO reliably learn the final legal action of multiple fresh-replay-qualified full-boss successes when the boundary is calibrated by actual live source-policy outcomes before training?
hypothesis: EXP-0024 demonstrates that full untouched Death Metal is occasionally solvable but too sparse for reproducible on-policy acquisition. The source policy selects the final successful action with 8.8, 50.0, and 18.4 percent probability on the three qualified seeds, while exact final-16 sequence likelihood is orders of magnitude lower. If live source evaluation confirms the one-action boundary lies inside the 10--90 percent competence band, it should establish the first measured reverse-curriculum rung while preserving exact observations, recurrent state, action masks, and terminal semantics.
changed_blocks: [training-level-distribution, data-selection, evaluation]
component_versions:
  reward: DeathMetalPotentialV5
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-qualified
  environment-semantics: player-health-only-boss-curriculum-v4
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  training-level-distribution: qualified-trace-tail-v5
  data-selection: disclosed-qualified-training-traces-v1
  evaluation: conditional-trace-tail-v14
invariants:
  - the declared source path and SHA-256 are immutable and its exact live one-action handoff completion rate is measured before training
  - training proceeds only when the source boundary lies inside the 10--90 percent gameplay-success band
  - every prefix starts from a fresh legal player20 full-boss reset and is replayed through acknowledged live game actions
  - every reset observation, action mask, and transition observation must match its fresh-launch qualification digest
  - replay actions warm the current learner recurrent state and stable feedback stream but never enter PPO
  - only learner-controlled actions contribute PPO transitions, reward, turns, or terminal outcomes
  - at least three distinct qualified 920xx training seeds are required
  - all 930xx EXP-0024 held-out seeds remain excluded from training and trace acquisition
  - trace-tail success is conditional curriculum evidence and never counts as normal-start Zone 2
  - exactly eight fixed-capacity workers and zero infrastructure contamination are required
arms:
  - id: a8-live-calibrated-tail1
    description: Three A8 PPO replications learn from the final one-action live boundary after the frozen source checkpoint passes the calibration matrix.
source:
  selection: strongest legal EXP-0024 training-only completion checkpoint
  checkpoint: runs/legal-death-metal-full-boss-potential/training/seed-94001/checkpoint-00092160.pt
  checkpoint_sha256: a7000ca0178248f9780220b124126100e6e3a0a32c6a19e149b61e883d69a05f
  trace_bank: runs/qualified-death-metal-trace-search/demonstration-bank.json
  qualification: runs/qualified-death-metal-trace-search/qualification.json
training:
  optimizer_seeds: [97001, 97002, 97003]
  workers: 8
  device: cuda
  architecture: 8
  transition_budget_per_trial: 61440
  initial_tail_actions: exactly 1; expand only in a later registered experiment after a frozen-policy gate passes
  recurrent_state: warm from exact live replay
  curriculum_start_level: 4
  curriculum_target_level: 5
  curriculum_profile: player20
  reward_config: configs/reward-death-metal-potential-v5.json
evaluation:
  source_calibration_modes: [deterministic, stochastic-98001, stochastic-98002]
  source_calibration_band: [0.10, 0.90]
  population: frozen final checkpoints evaluated after exact qualified handoffs on every selected training seed
  modes: [deterministic, stochastic-98001, stochastic-98002]
  learner_turn_cap: 64
  primary_outcome: conditional live Zone 2 entry after the handoff
  diagnostics: [source completion rate, final-policy per-trial completion rate, distinct completion seeds, learner turns, finite losses, worker restarts]
decision_rule: Expand the legal trace tail beyond one action only if live source calibration lies inside the 10--90 percent competence band and the three frozen final checkpoints aggregate at least 10 percent conditional completion across deterministic and two predeclared stochastic modes, at least two of three optimizer trials complete at least 5 percent, at least three distinct qualified game seeds complete, every optimizer trial completes at least once, losses are finite, and training plus evaluation controller restarts remain zero. Otherwise retain the boundary and diagnose acquisition rather than claiming progress. No outcome is normal-start promotion.
