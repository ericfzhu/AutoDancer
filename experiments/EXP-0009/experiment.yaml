evaluation:
  game_seeds: 57001-57024
  max_turns: 5000
  execution_trials:
    - mode: deterministic
      policy_seed: 0
    - mode: stochastic
      policy_seed: 91001
    - mode: stochastic
      policy_seed: 91002
  primary_outcome: number of distinct held-out game seeds reaching Zone 2
  diagnostics:
    - Zone 2 success by game seed and policy sample
    - floor and zone progress
    - action distribution by execution mode
    - staircase discovery and conversion
    - unique positions and unchanged/repeated-direction behavior
    - deaths, time limits, kills, and items
decision_rule: Adopt stochastic execution as a candidate only if one frozen checkpoint reaches Zone 2 on at least three distinct held-out game seeds and at least two game seeds reach Zone 2 under both stochastic policy seeds, with valid controller reports and no natural restart. An isolated stochastic Zone 2 result is inconclusive. If no stochastic trial reaches Zone 2, reject execution-mode mismatch as the main blocker and proceed to a predeclared environment/reward exploration intervention.
