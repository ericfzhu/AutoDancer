schema_version: 1
id: EXP-0009
title: Stochastic policy execution calibration
question: Does reproducibly sampling the high-entropy PPO policy reveal repeatable Zone 2 progress that argmax evaluation suppresses?
hypothesis: The categorical policies learned useful stochastic trajectories during training, but argmax collapses near-tied logits into repeated directions; sampled execution will therefore reach Zone 2 on multiple held-out seeds more reliably than deterministic execution.
changed_blocks: [evaluation]
component_versions:
  reward: V2
  architecture: [A2, A8]
  observation: [legacy-A2, schema9-rich]
  controller: schema10-qualified
  action-contract: current-11
  algorithm: recurrent-ppo-v1
  optimization-schedule: frozen-policy
  runtime: async-native-pipe-v1
  evaluation: schema10-stochastic-v1
invariants:
  - Bard normal seeded All Zones
  - eight fixed-capacity workers
  - qualified schema-10 controller and repository mod
  - no model, reward, observation, action, PPO, or checkpoint changes
  - the same held-out game seeds for every checkpoint and execution mode
  - action samples keyed only by policy seed, game seed, and turn, never worker timing
  - infrastructure retries replay both the game seed and action-sample stream from turn zero
arms:
  - id: a2-frozen
    description: Promoted Reward-V2/A2 checkpoint evaluated under argmax and two reproducible stochastic policy samples.
    component_versions:
      architecture: A2
      observation: legacy-A2
  - id: a2-continuation
    description: EXP-0008's 250,880-transition A2 continuation evaluated under the same three execution trials.
    component_versions:
