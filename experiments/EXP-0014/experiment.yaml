schema_version: 1
id: EXP-0014
title: Boss curriculum tactical-observation test
question: Can a short-horizon boss curriculum teach repeatable Zone 2 entry, and does access to the controller's rich tactical state improve that learning over legacy A2?
hypothesis: Boss-local training will turn the currently unobserved Zone 2 milestone into a learnable signal; function-preserving A8 will learn it more reliably than A2 because it can observe boss-facing, timing, charge, shield, tell, explosive, music, and complete inventory state.
changed_blocks: [architecture, observation, optimization-schedule]
component_versions:
  reward: V2
  architecture: [A2, A8]
  observation: [legacy-A2, schema9-rich]
  controller: schema10-requalified-current-hashes
  environment-semantics: curriculum-level-start-v1
  learner-diagnostics: critic-health-v2
  action-contract: current-11
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: boss-curriculum-function-preserving-a2-vs-a8-v1
  training-level-distribution: reverse-curriculum-sequential-goto-v1
  runtime: async-native-pipe-v1
  evaluation: boss-curriculum-learning-v6
invariants:
  - both arms begin as the exact same frozen A2 policy function
  - Bard normal seeded All Zones run identity followed by sequential real-game GOTO to the Zone 1 boss
  - no reward or trajectory transition for curriculum setup
  - entry to Zone 2 Floor 1 is the curriculum terminal and only success event
  - exactly eight fixed-capacity workers
  - identical finite training seeds, training RNG seed, transition budget, PPO settings, reward, action contract, and held-out evaluation seeds
  - explicit 1,000-turn training and evaluation horizon with partial-episode value bootstrapping
  - Reward V2 and no reward-policy changes
  - shaped return never selects an arm
  - curriculum-start outcomes cannot promote a normal-start policy
arms:
  - id: a2-boss-curriculum
    description: Continue the strongest legacy A2 policy on the finite boss-to-Zone-2 curriculum.
    component_versions:
      architecture: A2
      observation: legacy-A2
  - id: a8-boss-curriculum
    description: Upgrade the same A2 function to zero-projected A8, train only the rich adapter for ten updates, then jointly train on the identical curriculum.
    component_versions:
      architecture: A8
      observation: schema9-rich
training:
  source_checkpoint: runs/corrected-a2-replication/training/seed-39001/checkpoint-00061440.pt
  source_checkpoint_sha256: dbea9bf9bcd65489057524b6cac82e5d6a6fdb55e9b290b1f0e8d24b73114b38
  initialization: exact function-preserving fine-tune with fresh optimizer
  training_seed: 65001
  game_seed_pool: 64001-64032
  curriculum_start_level: 4
  curriculum_target_level: 5
  max_turns_per_episode: 1000
  workers: 8
  device: cuda
  transition_budget_per_arm: 122880
  checkpoint_steps: [30720, 61440, 122880]
  a8_base_freeze_updates: 10
  reward_config: configs/reward-v2.json
  reward_config_sha256: 84494b038f1d6c8e144d72e84dbca7227de2881f5ab8973b384758d7aff53b12
evaluation:
  game_seeds: 66001-66024
  curriculum_start_level: 4
  curriculum_target_level: 5
  max_turns: 1000
  workers: 8
  execution_trials:
    - mode: deterministic
      policy_seed: 0
    - mode: stochastic
      policy_seed: 96001
    - mode: stochastic
      policy_seed: 96002
  primary_outcome: distinct held-out seeds entering Zone 2 Floor 1
  diagnostics:
    - curriculum completion and distinct successful seeds by policy mode
    - completion-time distribution
    - deaths, player damage, boss damage, and kills
    - training completion rate by update quartile
    - entropy, explained variance, policy loss, value loss, KL, and clipping
    - distinct training seeds sampled and time-limit rate
    - controller validity, capacity, restarts, and infrastructure events
decision_rule: An arm passes only if its final checkpoint enters Zone 2 on at least three distinct held-out seeds and succeeds in at least two policy modes, with valid controllers and no natural restart. If both pass, select lexicographically by distinct successful seeds, aggregate completion rate, death rate, and completion time. If neither passes, extend only an arm whose last-quarter training completion rate exceeds its first-quarter rate and which has at least one held-out success; otherwise reject both and declare a boss-specific tactical/action intervention. A passing arm advances to a separately declared Floor-3-to-Zone-2 stage; no boss-start result is normal-start promotion evidence.
