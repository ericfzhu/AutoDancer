decision_rule: Existing boss competence is supported only if at least three distinct seeds enter Zone 2 and the direction appears in at least two policy modes. Otherwise the result identifies boss combat as an independent bottleneck and authorizes a separately declared boss-to-Zone-2 curriculum training experiment. No curriculum-start result can promote the agent; normal-start Zone 2 acceptance remains unchanged.
