question: Does the strongest frozen A2 checkpoint already contain enough local combat competence to cross the Zone 1 boss boundary when early-floor navigation is removed?
hypothesis: Starting from the real Zone 1 boss will shorten the causal horizon enough for the frozen local policy to produce measurable Zone 2 entries, distinguishing a navigation bottleneck from a boss-combat bottleneck.
