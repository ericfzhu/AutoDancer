  gameplay_qualification: runs/bounded-bard-gameplay-qualification-final/result.json
  hashes: Bind source, qualification, protocol, reward, runner and all Python/Lua controller/training files in the runtime manifest before gameplay.
training:
  seed_pool: [214001, 214003, 214004, 214009, 214012, 214014, 214017, 214020, 214031, 214035, 214037, 214040, 214041, 214050, 214058, 214060]
  optimizer_seed: 217001
  total_steps: 16384
  rollout_length: 128
  sequence_length: 32
  sequence_encoding_batch_size: 16
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  inference_transfer_mode: legacy
  evaluation_interval: 0
  checkpoint_interval: 4096
evaluation:
  training_seeds: [214001, 214003, 214004, 214009, 214012, 214014, 214017, 214020, 214031, 214035, 214037, 214040, 214041, 214050, 214058, 214060]
  development_seeds: [214064, 214071, 214085, 214089, 214100, 214102, 214103, 214105]
  policy_streams: [215001, 215002]
  policy_mode: stochastic
  episodes_per_checkpoint: 48
  max_turns: 500
  primary: Completion fraction by training/development pool with paired per-seed outcomes.
  secondary: Boss damage, deaths, episode turns, reward, action distribution, controller health and elapsed time.
decision_rule: Always diagnostic and no promotion. A development completion increase of at least 0.10 with nondecreasing training completion motivates a replicated experiment; otherwise report the paired changes and learning curve as inconclusive. Single-seed flat results do not establish inability to learn. Any qualification, scope, controller, numerical or budget failure invalidates the attempt and stops dependent stages.
