schema_version: 1
id: EXP-0036
title: Bounded direct-start learning pilot after control qualification
question: Does a short PPO fine-tune improve direct-start assisted Death Metal performance under the qualified bounded Bard contract?
hypothesis: Correct dagger state and contextual controls may permit measurable learning from direct starts that previously depended on guided handoffs.
changed_blocks: [observation, action-contract, training-level-distribution, evaluation]
component_versions:
  observation: bounded-bard-controls-v1
  action-contract: bounded-bard-v1
  training-level-distribution: bounded-direct-pilot-v1
  evaluation: bounded-direct-pilot-v1
  controller: schema10-bounded-refresh-v1
  architecture: A8
  reward: DeathMetalPotentialV5
invariants:
  - One exploratory optimizer trial; no replication, sweep, promotion or causal attribution to a single interface change.
  - Forty-five-minute total execution cap including evaluations and startup; twenty-minute hard training cap. Timeouts invalidate the attempt, with no substitute checkpoint selection.
  - Current controller qualification and scoped gameplay qualification must pass and bind unchanged source artifacts before launch.
  - Exactly eight workers, assisted Bard player20, start level 4, target level 5, 500-turn episodes, bounded-bard-v1 action contract throughout.
  - Unexpected equipment, infrastructure recovery, nonfinite core optimization metrics or source drift invalidate the attempt; no gameplay-loss substitution or seed replacement.
  - No guide actions, demonstrations, architecture changes, reward changes or final-test gameplay.
  - Source initialization preserves all model weights including critic with a fresh optimizer; no base or actor freezing.
  - A zero initial success rate does not abort this pilot; whether the corrected interface permits any learning is the question. EXP-0035 remains closed.
arms:
  - id: frozen
    description: Source checkpoint evaluated under bounded-bard-v1 before training.
  - id: pilot
    description: Source checkpoint fine-tuned for 16384 transitions and evaluated once at the final checkpoint.
