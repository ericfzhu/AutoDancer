schema_version: 1
id: EXP-0030
title: Retained live Death Metal handoff window
question: Can a balanced window retain the accepted tail-32 boss skill while moving the learner to the next earlier live competence boundary?
hypothesis: EXP-0029 made tail 32 reproducibly solvable, but training only one exact handoff risks state memorization and forgetting during expansion. Uniform replay of tail 32 and every four-action boundary through the next measured 10--90 percent frontier should expand control earlier in the fight without losing the mastered rung.
changed_blocks: [training-level-distribution, evaluation]
component_versions:
  reward: DeathMetalPotentialV5
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-requalified-current-hashes
  environment-semantics: player-health-only-boss-curriculum-v4
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v2-warm-boundary-state
  training-level-distribution: qualified-trace-window-v8
  data-selection: disclosed-qualified-training-traces-v1
  runtime: async-native-pipe-v1
  evaluation: conditional-trace-window-v17
invariants:
  - source calibration evaluates tails 36 through 80 in four-action increments plus tail 81 and selects the shortest boundary inside the closed 10--90 percent completion band
  - calibration uses deterministic execution and fixed stochastic policy seeds 98001 through 98004 on all three qualified training seeds
  - training samples a balanced window containing retained tail 32 and every tested four-action boundary through the selected frontier
  - handoff selection is deterministic by worker slot and checkpointed episode count, independent of actor timing
  - every guide action is acknowledged in the live game, excluded from PPO, and used to warm the learner recurrent state and stable reward feedback
  - frozen evaluation separately scores retained tail 32 and the selected harder tail under deterministic execution and stochastic seeds 98001 and 98002
  - all 930xx held-out seeds remain excluded from calibration, training, and trace acquisition
  - assisted completion never counts as normal-start Zone 2 evidence
  - exactly eight workers, finite losses, zero controller restarts, and current qualification hashes are required
arms:
  - id: a8-retained-trace-window
    description: Three A8 PPO replications initialize from the accepted EXP-0029 checkpoint and train uniformly over the retained-to-frontier live handoff window.
