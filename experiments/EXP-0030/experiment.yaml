decision_rule: Accept the expansion only if the selected harder boundary aggregates at least 10 percent completion, at least two trials reach 5 percent, every trial completes at least once, all three trace seeds complete, retained tail-32 completion remains at least 80 percent, losses are finite, and training plus evaluation have zero controller restarts. A pass authorizes another retained-window expansion; reaching the maximum legal tail authorizes a separately registered prefix-free full-boss test. No assisted outcome is normal-start promotion.
