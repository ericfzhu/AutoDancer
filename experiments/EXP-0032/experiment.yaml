  candidate_tail_actions: [44, 48, 52, 56, 60, 64, 68, 72, 76, 80, 81]
  retained_tail_window: [32, 36, 40]
  policy_modes: [deterministic, stochastic-98001, stochastic-98002, stochastic-98003, stochastic-98004]
