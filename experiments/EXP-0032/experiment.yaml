schema_version: 1
id: EXP-0032
title: Reproducible retained Death Metal handoff-window expansion
question: Can the accepted tail-32-through-tail-40 policy move to the next earlier live boundary while at least two independent checkpoints retain every mastered handoff?
hypothesis: EXP-0031 acquired tail 40, but one optimizer trial forgot tail 32. Requiring two independently retention-eligible checkpoints while replaying the complete accepted window should distinguish reproducible curriculum composition from a single favorable optimizer trajectory.
changed_blocks: [training-level-distribution, evaluation]
component_versions:
  reward: DeathMetalPotentialV5
  architecture: A8
  observation: schema10-corrected-memory-boss
  controller: schema10-requalified-current-hashes
  environment-semantics: player-health-only-boss-curriculum-v4
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v2-warm-boundary-state
  training-level-distribution: qualified-trace-window-v10
  data-selection: disclosed-qualified-training-traces-v1
  runtime: async-native-pipe-v1
  evaluation: conditional-trace-window-v19
invariants:
  - source calibration evaluates tails 44 through 80 in four-action increments plus tail 81 and selects the shortest boundary inside the closed 10--90 percent completion band
  - calibration uses deterministic execution and fixed stochastic policy seeds 98001 through 98004 on all three qualified training seeds
  - training samples a balanced window containing retained tails 32, 36, and 40 plus every tested four-action boundary through the selected frontier
  - handoff selection is deterministic by worker slot and checkpointed episode count, independent of actor timing
  - guide transitions remain acknowledged live actions outside PPO and warm the exact learner recurrent state and stable reward feedback
  - frozen evaluation scores every retained tail and the selected harder tail separately under deterministic execution and stochastic seeds 98001 and 98002
  - every retained boundary must independently aggregate at least 80 percent success
  - at least two optimizer trials must each score at least 80 percent on every retained boundary before either can be selected
  - all 930xx held-out seeds remain excluded from calibration, training, and trace acquisition
  - assisted completion never counts as normal-start Zone 2 evidence
  - exactly eight workers, finite losses, zero controller restarts, and current qualification hashes are required
arms:
  - id: a8-retained-trace-window-3
    description: Three A8 PPO replications initialize from the retention-eligible EXP-0031 checkpoint and train uniformly over the complete retained-to-frontier live handoff window.
