schema_version: 1
id: EXP-0017
title: Player-health assistance reduction with mastered-start replay
question: Does the selected EXP-0016 policy generalize to a 10-health Death Metal start, and if frozen transfer is insufficient, can mixed replay consolidate that harder start without forgetting the mastered 20-health skill?
hypothesis: The assisted finishing policy already has substantial player10 competence; a predeclared frozen transfer gate may pass directly, otherwise an 80/20 player10-to-player20 episode mixture will improve harder-start completion while protecting the mastered policy.
changed_blocks: [environment-semantics, optimization-schedule, training-level-distribution, evaluation]
component_versions:
  reward: V4A
  architecture: A2
  observation: schema10-corrected-memory-boss
  controller: schema10-requalified-current-hashes
  environment-semantics: mixed-assisted-curriculum-v3
  learner-diagnostics: boss-objective-v3
  action-contract: map-navigation-prior-v1
  algorithm: recurrent-ppo-v1-corrected-truncation
  optimization-schedule: assistance-reduction-with-replay-v1
  training-level-distribution: mixed-curriculum-replay-v1
  runtime: async-native-pipe-v1
  evaluation: assistance-transfer-and-retention-v8
invariants:
  - the selected EXP-0016 seed-68002 checkpoint is the only parent and is never chosen using shaped return
  - Bard normal seeded All Zones identity is followed by a real-game sequential GOTO to Zone 1 Floor 4
  - assistance applies only at setup, emits no trajectory transition or reward, and target completion requires live entry to Zone 2 Floor 1
  - every evaluated or trained game seed is telemetry-confirmed as Death Metal
  - the frozen-transfer gate is evaluated once and its seeds are never reused if optimization begins
  - optimization, if needed, uses exactly 80 percent boss1hp-player10 and 20 percent mastered boss1hp-player20 episodes
  - the weighted reset sampler is per-slot deterministic, checkpointed exactly, and infrastructure recovery replays the same seed and reset specification
  - exactly eight fixed-capacity workers use the qualified schema-10 controller; infrastructure faults invalidate evidence
  - Reward V4A, A2, map-navigation-prior-v1, PPO settings, training pool, horizon, and budget are identical across optimization trials
  - gameplay completion, death, and mastered-profile retention select outcomes; shaped return never does
  - no assisted boss result promotes the policy as normal-start Zone 2 evidence
arms:
  - id: frozen-player10-transfer
    description: Evaluate the unchanged selected EXP-0016 parent on fresh player10 Death Metal starts before authorizing any optimizer update.
    component_versions:
      architecture: A2
      environment-semantics: assisted-single-boss-curriculum-v2
      optimization-schedule: frozen-policy
      training-level-distribution: reverse-curriculum-sequential-goto-v1
  - id: mixed-player10-replay
    description: Conditional three-trial fine-tuning arm using 80 percent player10 episodes and 20 percent mastered player20 replay.
    component_versions:
      architecture: A2
      environment-semantics: mixed-assisted-curriculum-v3
      optimization-schedule: assistance-reduction-with-replay-v1
      training-level-distribution: mixed-curriculum-replay-v1
