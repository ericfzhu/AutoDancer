  result: experiments/EXP-0017/calibration-result.json
  sampled_player10_completion: 17/24
  selected_mixture: 80 percent player10 / 20 percent mastered player20
  live_mixed_reset_conformance: 16/16 valid across two swapped eight-worker waves with zero restarts
