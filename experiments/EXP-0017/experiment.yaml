  initialization_if_training: function-preserving fine-tune with fresh optimizer and RNG; preserve encoder, recurrent policy, actor, and critic
frozen_transfer_gate:
  candidate_seed_range: 69001-69256
  heldout_selection: ascending first 24 seeds whose official boss_type telemetry is DEATH_METAL
  curriculum_start_level: 4
  curriculum_target_level: 5
  curriculum_profile: boss1hp-player10
  max_turns: 500
  workers: 8
  execution_trials:
    - {mode: deterministic, policy_seed: 0}
    - {mode: stochastic, policy_seed: 100001}
    - {mode: stochastic, policy_seed: 100002}
  pass_rule: sampled aggregate completion at least 50 percent, at least 12 distinct successful seeds, sampled death rate at most 50 percent, deterministic completion at least 20 percent, exact controller validity, and zero restarts
  action_if_passed: retain the frozen parent without optimizer updates and advance to a separately declared player6 transfer calibration
  action_if_failed: these seeds become development history and the predeclared mixed optimization runs
