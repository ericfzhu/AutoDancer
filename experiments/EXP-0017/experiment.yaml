  source_checkpoint: runs/assisted-death-metal/training/seed-68002/final.pt
  training_seeds: [70001, 70002, 70003]
  game_seed_pool: [64001, 64002, 64012, 64013, 64016, 64018, 64020, 64026, 64027]
  curriculum_config: configs/curriculum-exp0017-player10-replay.json
  workers: 8
  transition_budget_per_trial: 51200
evaluation:
  first_stage: frozen transfer gate on the first 24 telemetry-confirmed Death Metal seeds in 69001-69256
  conditional_acceptance_stage: matched player10 and player20 evaluation on fresh Death Metal seeds in 71001-71256
  modes: [deterministic, stochastic-100001, stochastic-100002]
  max_turns: 500
  primary_outcome: live entry to Zone 2 Floor 1
acceptance_if_training:
  candidate_seed_range: 71001-71256
  selected_seeds: ascending first 24 telemetry-confirmed Death Metal seeds
  modes: [deterministic, stochastic-101001, stochastic-101002]
  profiles: [boss1hp-player10, boss1hp-player20]
  primary_rule: aggregate player10 sampled completion at least 50 percent, improvement over the frozen transfer baseline, at least 12 distinct successful seeds, and the improvement direction in at least two of three checkpoints
  retention_rule: player20 sampled completion remains at least 80 percent of the frozen parent's matched-seed rate
  safety_rule: sampled player10 death rate at most 50 percent, exact controller validity, finite losses, changing parameters, and zero natural restarts
  selection: lexicographic by player10 distinct successful seeds, player10 completion, player10 death rate, player20 retention, then median completion turns
decision_rule: Run the frozen transfer gate first. If it passes, do not optimize a skill the parent already possesses. If it fails, run exactly the three predeclared mixed-replay trials and accept only on the fresh 71001-71256 suite. If neither path passes, retain the EXP-0016 parent and introduce an intermediate assistance profile rather than changing reward or architecture post hoc.
