<meta charset="utf-8">
<title>AutoDancer Agent Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>

      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>

    <aside id="panel">

  </div>
</div>

<script>
const GROUPS = [{"id":"live","title":"The authoritative live loop"},{"id":"sense","title":"What the agent can know"},{"id":"decide","title":"Choosing and scoring actions"},{"id":"learn","title":"Collecting and changing weights"},{"id":"evidence","title":"Evidence and operations"},{"id":"future","title":"Experimental candidates"}];
const NODES = [{"id":"G","code":"G","name":"Live game task","short":"LIVE GAME","group":"live","gx":1,"gy":1,"w":3,"d":2,"h":42,"kind":"slab","one":"The real game is the environment and the source of truth.","what":"Each worker runs Bard in a normal seeded All Zones run. A transition is valid only after the engine accepts a command and reports the resulting authoritative state and events.","how":"<strong>Version lineage.</strong><br><code>Early</code> attached to one user-run process and depended on manual setup.<br><code>Schema 4</code> introduced supervisor-created worker identities and seeded resets through a coordinator-era protocol.<br><code>Current</code> launches workers directly, keeps exactly N healthy slots, and never attaches to unrelated processes. Gameplay semantics remain the real engine's.","steps":[["Reset","Start a normal Bard All Zones run with the requested seed and a fresh run ID."],["Turn","Accept exactly one logical action in a safe engine state."],["Resolve","Let the engine update movement, combat, items, traps, floors, bosses, and terminal state."],["Report","Return the complete acknowledged transition."]],"cond":[{"q":"Which mode and character are permitted?","r":"Only Bard in normal seeded All Zones; Daily Challenge is excluded (2026-08-24)."},{"q":"What is the practical maximum worker count?","to":"Run autodancer-benchmark across 1, 2, 4, 6, 8, 10, and 12 workers on the target machine."}]},{"id":"B","code":"B","name":"Lua/native bridge","short":"PIPE BRIDGE","group":"live","gx":5.5,"gy":1,"w":3,"d":2,"h":56,"kind":"gate","one":"The bridge turns logical commands into acknowledged engine transitions.","what":"Lua observes the live engine and accepts ASCII ACTION, RESET, and CLOSE commands. A small native module carries commands and JSON records over a worker-specific duplex Windows named pipe.","how":"<strong>Version lineage.</strong><br><code>Schema 4</code> used per-worker command files and JSONL telemetry discovered from logs.<br><code>Schema 5</code> moved complete records to direct named pipes, retained ASCII commands, and removed per-turn log dependence.<br><code>Schemas 6–9</code> kept the transport while extending observation semantics. Identity, session, run, seed, sequence, and acknowledgement checks remain mandatory. See <code>mods/AutoDancer/scripts/</code> and <code>src/autodancer/live/</code>.","steps":[["Receive","Read a framed command from this worker’s pipe."],["Pend","Keep it pending until the engine is in a safe state."],["Accept","Bind command ID, requested action or seed, and run identity."],["Send","Write one complete JSON transition, up to 64 KiB, back over the same pipe."]],"cond":[{"q":"Should telemetry use a compact binary observation frame?","r":"Not yet: direct JSON pipes exceeded the 2× throughput target, so binary framing remains contingent on future profiling (2026-08-24)."},{"q":"Can records from another worker be accepted?","r":"No; cross-worker, stale-session, duplicate, run-ID, seed, and sequence mismatches are rejected (2026-08-24)."}]},{"id":"A","code":"A","name":"Action contract","short":"11 ACTIONS","group":"live","gx":10,"gy":1,"w":3,"d":2,"h":44,"kind":"gate","one":"The policy chooses one of eleven engine-level Bard actions.","what":"The discrete action space is up, right, down, left, wait, bomb, action-item 1, action-item 2, throw, spell 1, and spell 2. The observation carries a mask so unavailable inventory actions cannot be sampled.","how":"<strong>Version lineage.</strong><br><code>Early</code> control sent directions to an attached game.<br><code>Schema 5+</code> standardized 11 logical actions and command acknowledgements.<br><code>Current</code> always enables directions and WAIT, derives all six special-action bits from inventory/cooldown state, and requires SYNCHRONY's observed engine action to equal the injected action. Before/after state and events classify movement, wait, combat, interaction, digging, wall attempts, unchanged directions, special no-effect, and floor transitions.","steps":[["Mask","Always enable directions and wait; match special actions exactly to inventory state."],["Sample","Mask logits, then sample during training or take argmax during evaluation."],["Acknowledge","Require the observed engine action to equal the injected action."],["Classify","Describe the resolved mechanic from authoritative before/after state and events."]],"cond":[{"q":"Should known blocked directions be masked?","to":"Use outcome-classified live evidence to design a context-aware mask that preserves attacks, digging, and interactions."},{"q":"Is WAIT available now?","r":"Yes; logical action 4 maps to engine IDLE, is always legal while Bard is running, and was live-acknowledged exactly (2026-08-24)."}]},{"id":"W","code":"W","name":"Worker fleet","short":"WORKER FLEET","group":"live","gx":1,"gy":5.5,"w":3,"d":3,"h":58,"kind":"cards","one":"Python owns exactly N isolated live-game workers.","what":"The supervisor launches hidden, minimum-resolution workers with isolated profiles, unique identities and pipes, muted audio output, and only required game content. It refuses unrelated NecroDancer processes and cleans up only its own.","how":"<strong>Version lineage.</strong><br><code>Single-instance</code> required a running game.<br><code>Coordinator era</code> used one hidden coordinator plus N native duplicate workers.<br><code>Current</code> removes the unused coordinator from training: Python directly launches N workers, spreads affinity when beneficial, monitors process metrics, and replaces failed slots at fixed capacity. Implemented in <code>src/autodancer/live/supervisor.py</code>.","steps":[["Preflight","Validate the game, native DLL, mod, requested N, and absence of unrelated processes."],["Isolate","Create worker-specific LocalAppData and Roaming profiles."],["Launch","Start each hidden worker with unique instance, config, log, pipe, and seed identities."],["Recover","Replace a crashed or timed-out slot, reset its episode and recurrent state, and preserve N."]],"cond":[{"q":"Does explicit --num-instances N permit fewer workers?","r":"No; startup or recovery fails clearly rather than silently reducing capacity (2026-08-24)."},{"q":"Should Windows affinity always override the scheduler?","r":"Only when the auto benchmark finds a repeatable gain; otherwise Windows scheduling is retained (2026-08-24)."}]},{"id":"O","code":"O","name":"Live observation","short":"OBSERVATION","group":"sense","gx":5.5,"gy":5.5,"w":3,"d":3,"h":66,"kind":"screen","one":"A player-visible tensor contract describes the current turn.","what":"The current schema exposes a 21×21 local grid, player and song state, thirteen inventory slots, a legal-action mask, map bounds, events, and identity metadata. Exact entity and item types use stable hashes; unseen facts stay unknown.","how":"<strong>Version lineage.</strong><br><code>Schema 4</code> established multi-worker identity.<br><code>5</code> redesigned compact local grid, player, inventory, and 11-action semantics.<br><code>6</code> added persistent map input.<br><code>7</code> added enemy timing/status, facing, charge and shield cues, song timing, and full equipment cooldowns.<br><code>8</code> added objects, interaction flags, prices, trap state, tells, and explosives.<br><code>9</code> added shop-music volume and level bounds/capacity validation. See <code>docs/protocol.md</code>.","steps":[["Hook","Read engine components after the accepted turn resolves."],["Assemble","Build the 21×21 grid once and attach player, inventory, action, event, and map metadata."],["Validate","Check schema, build, shapes, ranges, identities, and sequence."],["Convert","Expose stable NumPy tensors to memory, reward, policy, and dashboard consumers."]],"cond":[{"q":"Can multiple objects share one cell without information loss?","to":"Define an ordered or set-valued representation for overlapping visible entities and objects before the next schema bump."},{"q":"Are transient audio cues fully represented?","to":"Audit player-audible cues beyond the current shop-music signal and route justified additions through A7."}]},{"id":"M","code":"M","name":"Spatial map memory","short":"FLOOR MEMORY","group":"sense","gx":10,"gy":5.5,"w":3,"d":3,"h":34,"kind":"store","one":"A 65×65 memory records revealed terrain and Bard’s own traversal.","what":"The memory keeps floor-local revealed terrain, visit counts, and visit recency in absolute coordinates, then renders a player-centred 65×65 viewport. It never invents unseen terrain or retains stale off-screen entities.","how":"<strong>Version lineage.</strong><br><code>A2 / schema 5</code> had no explicit spatial memory; only the LSTM could remember past views.<br><code>A3 / schema 6</code> added a five-channel map anchored at the spawn.<br><code>A6 schema-9 fix</code> retained absolute history but changed the policy view to player-centred, eliminating clipping as Bard moved away from spawn. Levels larger than 65×65 fail clearly. Implemented in <code>src/autodancer/memory.py</code>.","steps":[["Reset floor","Clear history when zone or floor identity changes."],["Merge view","Add only terrain currently marked visible or revealed by the game."],["Record travel","Increment Bard’s known visit count and recency."],["Render","Centre the fixed policy viewport on Bard and encode five map channels."]],"cond":[{"q":"Why not store off-screen enemies?","r":"Their current positions are not player-knowable after they leave view; retaining them would create an informational advantage (2026-08-24)."},{"q":"What happens on maps larger than 65×65?","r":"Capacity validation fails instead of silently clipping; supporting larger custom levels requires a new representation (2026-08-24)."}]},{"id":"P","code":"P","name":"Policy and value network","short":"ACTOR CRITIC","group":"decide","gx":5.5,"gy":10.5,"w":4,"d":3,"h":82,"kind":"tall","one":"One hybrid neural network chooses actions and estimates future return.","what":"Parallel encoders process local geometry, salient entities, inventory, player/audio state, previous action/reward, and—after A2—the explicit map. They fuse to 512 features, pass through a 512-unit LSTM, and split into masked actor and critic heads.","how":"<strong>Architecture lineage.</strong><br><code>A2 · schema 5 · 5,953,167</code>: local residual CNN, entity transformer, player MLP, eight-slot inventory transformer, context encoder, 512 LSTM.<br><code>A3 · schema 6 · 6,398,494</code>: adds 65×65 map CNN and expands fusion 896→1,024.<br><code>A4 · schema 7 · 6,401,258</code>: tactical, song, and thirteen-slot equipment state.<br><code>A5 · schema 8 · 6,478,670</code>: hazards, objects, interactions, prices, tells, explosives.<br><code>A6 · schema 9 · 6,478,798</code>: shop audio and bounds; same 512 LSTM and heads.<br><code>A7 · rejected · 6,401,648</code>: exact A2 plus a scalar-gated residual that stayed nearly closed.<br><code>A8 · candidate</code>: exact A2 plus the same sensory branch and a zero-output 512×512 projection that receives a full first-step gradient.","steps":[["Embed","Turn categorical classes, exact-type hashes, positions, and numeric state into compact features."],["Perceive","Run local/map CNNs and entity/inventory attention encoders in parallel."],["Fuse","Project all streams into a shared 512-value latent."],["Remember","Update the LSTM hidden and cell state."],["Decide","Produce 11 masked action logits and one state-value estimate."]],"cond":[{"q":"Is A6 too small to learn the game?","r":"The A6 pilot does not support that conclusion: it changed the latent interface and had only 51,200 new transitions versus A2’s 250,880. Capacity was not isolated (2026-08-24)."},{"q":"Would simply scaling parameter count solve progression?","to":"Establish a stable, behavior-preserving architecture and learning curve before running controlled width/depth scaling experiments."}]},{"id":"T","code":"T","name":"Temporal memory","short":"LSTM STATE","group":"decide","gx":10.5,"gy":10.5,"w":3,"d":3,"h":38,"kind":"store","one":"The LSTM carries learned context that explicit map channels do not.","what":"A separate hidden and cell state summarizes action history, recent encounters, timing, and other partially observable context. It complements, rather than replaces, the explicit floor map.","how":"<strong>Version lineage.</strong><br><code>A2–A6</code> all use the same 512-unit LSTMCell and store exact [hidden, cell] state at every transition.<br><code>Episode boundary</code> resets hidden state, previous action, and previous reward.<br><code>Worker recovery</code> discards the incomplete fragment and resets recurrent state for that slot. No architecture version has yet increased temporal-memory width.","steps":[["Initialize","Create zero hidden and cell tensors at reset."],["Condition","Combine current fused perception with previous action and reward context."],["Update","Produce next hidden and cell state on every live transition."],["Replay","Seed each 32-step PPO chunk with the exact stored initial state."]],"cond":[{"q":"How much does the trained policy rely on its LSTM?","to":"Run hidden-state ablations and delayed-information probes on fixed seeds without changing rewards."},{"q":"Does a persistent hidden state provide unlimited learnable memory?","to":"No. State persists during play, but 32-step truncated BPTT biases gradients toward local dependencies. Compare 32/64/128-step chunks on fixed recurrent batches before changing the recurrent architecture."},{"q":"Should the map be left to the LSTM instead?","r":"No; explicit player-like spatial memory removes an avoidable information burden, while the LSTM handles temporal context (2026-08-24)."}]},{"id":"R","code":"R","name":"Reward shaping","short":"REWARD","group":"decide","gx":1,"gy":10.5,"w":3,"d":3,"h":54,"kind":"box","one":"Bounded learning signals point toward the sparse goal without defining success.","what":"A stateful tracker deduplicates and caps exploration, combat, item, and navigation credit. Task reward, shaping reward, and gameplay outcomes are recorded separately; held-out gameplay selects policies.","how":"<strong>Reward lineage.</strong><br><code>Legacy</code>: direct events proved the loop but learned passivity.<br><code>V1</code>: stateful exploration/combat/items improved local competence but no stairs.<br><code>V2 · retained</code>: stair discovery/distance plus turn/revisit pressure produced the best local play and 24 training floor transitions.<br><code>V3 · rejected</code>: bounded positive progression reduced timeouts but caused unsafe activity.<br><code>V4A/B · rejected</code>: restored competence signals with 0.5/1.0 stair potential but became overwhelmingly passive.<br><code>V5</code>: deliberately undefined until the action/architecture issue is isolated.","steps":[["Observe transition","Compare authoritative events and episode-local state before and after the action."],["Deduplicate","Credit each enemy, item type, position, and revealed tile only under its defined rules."],["Cap","Keep renewable auxiliary positive credit below the +5 floor milestone."],["Split","Return total, task/extrinsic, shaping, and named component values."]],"cond":[{"q":"Should remaining stationary receive a generic penalty?","r":"Not yet: A6’s unchanged-position turns were directional inputs and may include attacks or digging. Classify outcomes first (2026-08-24)."},{"q":"What is Reward V5?","to":"Defer its design until blocked-action behavior and function-preserving A7 transfer are tested."}]},{"id":"C","code":"C","name":"Rollout actors","short":"ACTOR FLEET","group":"learn","gx":1,"gy":15.5,"w":3,"d":3,"h":58,"kind":"cards","one":"Independent actors gather one contiguous fragment per worker and policy version.","what":"Each actor owns its worker, episode, seed stream, recurrent state, pipe operations, and recovery. A central scheduler batches whichever observations are ready without forcing a per-step global barrier.","how":"<strong>Version lineage.</strong><br><code>Vector barrier</code> dispatched one action to every worker and waited for the slowest after every step.<br><code>Versioned async</code> gives each slot an independent 128-transition state machine, dynamically batches inference with a 2 ms maximum delay, and assembles stable [time, worker] tensors only after all fragments finish.<br><code>Recovery</code> discards only an incomplete fragment and recollects it under the same frozen policy version.","steps":[["Freeze","Hold model weights constant for this rollout version."],["Infer","Batch whichever actor observations arrive within the 2 ms window."],["Advance","Let every worker build its own contiguous 128-transition fragment."],["Recover","Replace and reset only a failed slot, then recollect its fragment."],["Assemble","Stack completed fragments in stable worker-slot order."]],"cond":[{"q":"Can a fast worker start using next-version weights early?","r":"No; fragments never mix policy versions. Fast workers wait after completing their contribution (2026-08-24)."},{"q":"Does asynchronous collection remove every barrier?","r":"It removes the per-step barrier, but PPO still waits for one complete same-version fragment from every fixed-capacity slot (2026-08-24)."}]},{"id":"L","code":"L","name":"Recurrent PPO learner","short":"PPO LEARNER","group":"learn","gx":5.5,"gy":15.5,"w":3.5,"d":3,"h":78,"kind":"job","one":"Clipped PPO changes the shared policy from complete live-game rollouts.","what":"The learner computes generalized advantage estimates, normalizes them, and replays exact recurrent chunks through clipped actor and value losses with entropy and gradient controls.","how":"<strong>Version lineage.</strong><br><code>Initial recurrent PPO</code> used the same core defaults but synchronous collection.<br><code>Architecture A2</code> established exact 32-step LSTM replay and architecture-checked checkpoints.<br><code>Async runtime</code> preserved the algorithm while feeding versioned actor fragments.<br><code>Current diagnostics</code> record one pre-clipping gradient snapshot per representation group on every update, alongside CUDA inference and optimization. Rollout cadence remains 128×N transitions per update. Defaults: γ .99, GAE .95, clip .2, lr 3e-4, entropy .01, value .5, grad norm .5, four epochs.","steps":[["Bootstrap","Estimate the value after the final rollout state."],["Advantage","Compute backward GAE; true termination must stop value bootstrap, while time-limit truncation must bootstrap its final observation but stop the trace across reset."],["Chunk","Split each worker trajectory into 32-step sequences with stored initial LSTM state."],["Optimize","Shuffle chunks across four epochs and update clipped policy and critic objectives."],["Publish","Increment the policy version only after the whole update finishes."]],"cond":[{"q":"Is one update per 1,024 steps optimal at eight workers?","to":"Benchmark rollout length, epochs, minibatch chunks, and GPU utilization while holding total environment steps and evaluation seeds fixed."},{"q":"Is γ=.99 aligned with multi-floor play?","to":"No evidence establishes that. Its effective horizon is about 100 turns and γ^1000 is roughly 4.3e-5, while failed episodes last 3,000–5,000 turns. Test horizon only as a versioned optimization/objective change with critic stability controls and matching potential-shaping discount."},{"q":"May PPO train on a partial healthy fleet?","r":"No; fixed capacity and same-version rollout integrity take precedence over silently continuing with fewer workers (2026-08-24)."}]},{"id":"K","code":"K","name":"Checkpoints and metrics","short":"CHECKPOINTS","group":"learn","gx":10.5,"gy":15.5,"w":3,"d":3,"h":32,"kind":"store","one":"Atomic artifacts make training recoverable and experiments auditable.","what":"A checkpoint stores model, optimizer, global step, PPO configuration, architecture specification, reward specification, random states, and running metrics. Run directories keep resolved configuration and JSONL metrics.","how":"<strong>Version lineage.</strong><br><code>Early</code> saved working model state for the pipeline.<br><code>A2+</code> requires exact architecture and PPO configuration for resume.<br><code>Reward V4+</code> embeds exact reward arm weights to prevent cross-arm confusion.<br><code>Current</code> supports exact resume plus explicit partial A2 warm-start paths that reset critic and optimizer when semantics change. Writes are atomic.","steps":[["Snapshot","Collect model, optimizer, counters, configs, RNG states, and metrics."],["Write atomically","Write a temporary artifact and replace the destination only when complete."],["Resume exactly","Validate architecture, PPO, and reward metadata before restoring all state."],["Warm-start explicitly","Transfer only declared compatible policy weights and initialize changed paths and critic afresh."]],"cond":[{"q":"Can an A2 checkpoint be silently resumed as A6?","r":"No; exact resume rejects it. Only the named partial warm-start path may transfer compatible weights (2026-08-24)."},{"q":"Which artifact is the measured baseline?","r":"runs/reward-v2-250k/final.pt, evaluated as Reward V2 Architecture A2 (2026-08-24)."}]},{"id":"E","code":"E","name":"Evaluation and selection","short":"EVALUATION","group":"evidence","gx":1,"gy":20.5,"w":3.5,"d":3,"h":48,"kind":"gate","one":"Unseen-seed gameplay—not shaped return—decides whether a version advances.","what":"Training reward is diagnostic, not the objective. Paired policies play fresh seeds with fresh recurrent state and a fixed turn cap; reports compare progression, death, timeouts, combat, items, movement, stairs, and runtime health.","how":"<strong>Version lineage.</strong><br><code>Baseline</code> compared checkpoint argmax play with masked random on held-out seeds.<br><code>Reward pilots</code> added paired multi-checkpoint gates and separated task, shaping, and gameplay metrics.<br><code>A6/A7/A8 gates</code> added transfer, representation, and long-horizon controls.<br><code>EXP-0009</code> tests argmax against turn-keyed stochastic samples because PPO trained a high-entropy sampled policy and stochastic collection progressed farther than deterministic evaluation.<br><code>Representation gate</code> perturbs one input group at a time and measures output sensitivity plus encoder gradients. A supported path below 1% of established-input medians is trace, not material.","steps":[["Predeclare","Write hypotheses, seeds, budgets, metrics, and pass/fail gates before training."],["Probe representation","Require material counterfactual sensitivity and gradient reach before broad training."],["Calibrate execution","When policy entropy is material, compare argmax with reproducible stochastic sampling before attributing failure to learning."],["Evaluate","Play ordered unseen game seeds with fresh recurrent state."],["Aggregate","Preserve per-seed outcomes, repeated policy samples, and arm-level summaries."],["Decide","Promote, continue, or reject using gameplay-ranked rules."],["Record","Store the immutable experiment decision and supporting artifacts."]],"cond":[{"q":"Why was A6 rejected even though it has more information?","r":"It failed the predeclared gameplay gate and produced worse local competence and more stationary outcomes within the pilot budget (2026-08-24)."},{"q":"Does the A6 result prove explicit map memory is harmful?","r":"No; the warm start randomly reinitialized the expanded fusion interface, so representation and transfer disruption were confounded (2026-08-24)."}]},{"id":"D","code":"D","name":"Symbolic dashboard","short":"DASHBOARD","group":"evidence","gx":6,"gy":20.5,"w":3.5,"d":3,"h":44,"kind":"screen","one":"A local page makes live training behavior and bottlenecks visible.","what":"The dashboard renders every worker’s symbolic 21×21 view from telemetry and keeps health, episode, reward, action, PPO, throughput, latency, recovery, and fragment-straggler metrics on one screen.","how":"<strong>Version lineage.</strong><br><code>Initial</code> exposed training metrics only.<br><code>Symbolic workers</code> added local grid views without game-window fidelity or screenshot capture.<br><code>Compact layout</code> constrained variable-length sections so reward components could not push the whole page below the viewport.<br><code>Async fix</code> publishes each actor transition to the dashboard, restoring visible movement during direct-pipe collection. Implemented in <code>src/autodancer/training/dashboard.py</code>.","steps":[["Publish","Collector sends the latest observation, action, reward, and worker info."],["Aggregate","Training loop attaches PPO, reward-component, throughput, and recovery metrics."],["Render","Local HTTP clients draw symbolic cells and compact metric panels."]],"cond":[{"q":"Does rendering symbolic workers affect the game workers?","r":"Only modestly: it reuses observation tensors already built for training and avoids image capture or full game rendering (2026-08-24)."},{"q":"Is the dashboard part of policy input?","r":"No; it is an observer only and cannot control or alter gameplay (2026-08-24)."}]},{"id":"F","code":"F","name":"Architecture A7 adapter","short":"A7 REJECTED","group":"future","gx":10.5,"gy":20.5,"w":3.5,"d":3,"h":62,"kind":"tall","one":"Exact A2 initialization succeeded, but every new-input path remained below material influence.","what":"A7 is an implemented experimental model. The complete A2 actor-critic remains intact while a separate branch reads only map, tactical, hazard, interaction, audio, and expanded inventory fields that A2 could not see.","how":"<strong>Measured lineage.</strong><br><code>Parity</code>: every A2 tensor—including critic—loaded under <code>base.*</code>, with exactly zero output and recurrent-state error at gate zero.<br><code>Training</code>: all three 51,200-step pilots were finite, but final gates were only −0.001276, +0.000265, and −0.000030.<br><code>Representation</code>: tactical grid, map, extended player, and extended inventory paths were numerically active, but zero of twelve checkpoint/group pairs reached both 1% sensitivity and gradient materiality; none changed an argmax action.<br><code>Gameplay</code>: two pilots reached floor 2, but items, timeouts, stationary behavior, and runtime health failed the declared gate.","steps":[["Load","Copy every A2 checkpoint tensor into the preserved base and reset only the optimizer."],["Prove parity","Measure exact output and deterministic-action parity before live training."],["Adapt","Let PPO learn the scalar gate and residual while continuing to update the A2 base."],["Measure influence","Perturb each new input group and backpropagate to its encoder."],["Reject","Retain A2 after representation and held-out gameplay gates fail."]],"cond":[{"q":"Was A7 behavior-preserving at initialization?","r":"Yes; unit tests and the real V2 checkpoint measured exact tensor and output parity, including reset-containing sequences (2026-08-24)."},{"q":"Did the richer observations receive meaningful influence?","r":"No: all twelve trained checkpoint/group checks were only trace-active, with zero material groups and zero argmax action changes (2026-08-24)."},{"q":"What replaces the scalar-gate design?","to":"Use a representation-learning preflight to test an exact-zero output projection or staged frozen-base adapter before live gameplay training."}]},{"id":"H","code":"H","name":"Architecture A8 controls","short":"A8 CONTROLS","group":"future","gx":14.5,"gy":20.5,"w":3.5,"d":3,"h":68,"kind":"tall","one":"A8 uses the rich inputs, but longer training still did not improve held-out progression.","what":"A8 preserves every A2 tensor and adds schema-9 perception through a zero-output 512×512 matrix projection. EXP-0007 proved exact initialization parity and material influence from all four new groups. EXP-0008 then continued A2 and A8 exactly to 250,880 transitions; neither improved final held-out progress, and A8 lost local combat and item competence relative to frozen A2.","how":"<strong>Qualified EXP-0007.</strong><br><code>A2 frozen</code>: broad progress 1.00, death 0.30, 44 kills, 37 items, unchanged position 0.913.<br><code>A8</code>: progress 1.00, death 0.20, 43 kills, 38 items, unchanged position 0.587.<br><strong>EXP-0008 final.</strong><br><code>A2 frozen</code>: progress 1.125 and Floor 2.<br><code>A2 continuation</code>: progress 1.00, 73 kills, 55 items.<br><code>A8 continuation</code>: progress 1.00, 38 kills, 28 items.<br><code>Interpretation</code>: added information and 250,880 transitions did not solve strategic navigation.","steps":[["Prove parity","Load the real V2 checkpoint and require zero logits, value, recurrent-state, and action error."],["Open projection","Freeze A2 for ten updates while the full residual matrix receives the first gradients."],["Qualify broadly","Use the schema-10 controller and fresh held-out seeds to separate activity from gameplay progress."],["Continue exactly","Resume A2 and A8 model, critic, optimizer, counters, and RNG state to 250,880 transitions."],["Test emergence","Require A8 to beat continued A2 at two consecutive checkpoints including the final checkpoint."]],"cond":[{"q":"Does A8 replace A2?","r":"No. EXP-0008 found no final held-out progress advantage at 250,880 transitions and worse local competence than frozen A2 (2026-08-26)."},{"q":"Did A8 solve A7’s gradient starvation?","r":"Yes: all four new observation groups were material at warmup and final, with exact A2 behavior at initialization (2026-08-26)."},{"q":"Did A8 merely need more of the same training?","r":"No evidence supports that explanation: the exact continuation to 250,880 transitions did not improve held-out floor progress (2026-08-26)."}]}];

nch":"residual"},"yx"],["F","A","gated logits",{"initial_gate":0},"xy"],["F","E","paired candidate",{"reward":"V2 unchanged"},"yx"]]},{"id":"a8","name":"Controlled A8 learning experiment","hops":[["K","H","exact V2 A2",{"parity_error":0},"xy"],["O","H","schema-9-only inputs",{"projection_initially_zero":true},"yx"],["H","L","frozen-base warmup",{"updates":10},"xy"],["L","E","four-point curves",{"controls":["legacy-no-wait","current"]},"yx"],["E","H","admit or stop",{"broad_only_after_pass":true},"xy"]]}];
const CH = [{"id":"turn","title":"The authoritative turn","reveal":["G","B","A"],"lede":"The irreducible loop is a logical action, a real engine turn, and one exact acknowledgement.","story":"<p>AutoDancer does not imitate the game. <mark>NecroDancer itself resolves every action.</mark> The bridge exists to make that live turn look like a strict RL transition without driving menus, keys, or screenshots.</p>","flow":[["A","B","ACTION",{"command_id":884,"action":"RIGHT"}],["B","G","accepted input",{"safe_state":true}],["G","B","resolved turn",{"sequence":885}]]},{"id":"fleet","title":"Many independent games","reveal":["W"],"lede":"One Python supervisor turns the live loop into a fixed-capacity fleet.","story":"<p>Every slot has its own process, profile, pipe, identity, seed stream, and episode. A failure pauses only that slot’s fragment, but <mark>capacity never silently shrinks</mark>.</p>","flow":[["W","G","launch exactly N",{"workers":8}],["G","B","worker readiness",{"instance_id":"worker-0003"}],["B","W","identity validated",{"healthy":true}]]},{"id":"sense","title":"What Bard can know","reveal":["O","M"],"lede":"Current perception and remembered space are separate, player-equivalent information sources.","story":"<p>The 21×21 observation describes now; the 65×65 map remembers revealed terrain and travel. The design excludes unseen terrain and stale enemies, so richer inputs do not become privileged engine state.</p>","flow":[["G","B","engine components",{"visible_only":true}],["B","O","schema-9 record",{"grid":"21×21×29"}],["O","M","revealed cells",{"world_coordinates":true}]]},{"id":"choose","title":"Choosing with two memories","reveal":["P","T"],"lede":"Spatial memory tells the policy where it has been; temporal memory carries learned context.","story":"<p>A hybrid actor-critic merges geometry, entities, inventory, player state, explicit map, and history. The map and LSTM are complementary: one is inspectable floor knowledge, the other is learned recurrent state.</p>","flow":[["O","P","current state",{"schema":9}],["M","P","map memory",{"channels":5}],["T","P","prior [h,c]",{"width":512}],["P","A","masked action",{"choices":11}],["P","T","next [h,c]",{"stored":true}]]},{"id":"reward","title":"Scoring without redefining success","reveal":["R"],"lede":"Reward shaping helps optimization; held-out gameplay remains the objective.","story":"<p>The tracker makes useful intermediate events learnable while bounding renewable credit. The history from Legacy through V4 is evidence that a higher or cleaner training return can still produce worse play.</p>","flow":[["O","R","before/after state",{"floor":1,"position_changed":true}],["G","R","events",{"enemy_kill":false}],["R","P","previous reward context",{"task":0,"shaping":0.005}]]},{"id":"collect","title":"Gathering live experience","reveal":["C"],"lede":"Workers advance independently, but every accepted rollout belongs to one frozen policy version.","story":"<p>The asynchronous collector removes the slowest-worker barrier from each turn. It still waits at the fragment boundary so PPO receives exactly 128 contiguous transitions from every slot with no version mixing.</p>","flow":[["O","C","ready observation",{"worker":3}],["P","C","batched inference",{"delay_ms":2}],["R","C","transition reward",{"named_components":true}],["C","T","store exact state",{"every_transition":true}]]},{"id":"learn","title":"Changing the weights","reveal":["L","K"],"lede":"Recurrent PPO replays short sequences, then publishes one new policy version.","story":"<p>At eight workers, the default learner updates after 1,024 fresh transitions. Exact recurrent states make 32-step replay faithful; atomic checkpoints make interruption and experiment comparison recoverable.</p>","flow":[["C","L","same-version rollout",{"transitions":1024}],["L","P","four PPO epochs",{"clip":0.2}],["L","K","atomic checkpoint",{"exact_resume":true}]]},{"id":"evidence","title":"Keeping experiments honest","reveal":["E","D"],"lede":"Representation gates admit candidates; held-out gameplay decides promotion.","story":"<p>A candidate must first prove that its new inputs can influence outputs and receive gradients materially. Evaluation uses unseen ordered game seeds and predeclared gameplay gates. EXP-0009 additionally calibrates deterministic argmax against reproducible stochastic execution because PPO trained a sampled policy. The dashboard is operational visibility—not an input.</p>","flow":[["K","E","candidate",{"architecture":6}],["E","W","unseen seeds",{"count":30}],["W","E","outcomes",{"mean_floor_progress":1.011}],["E","D","decision",{"retain":"A2"}]]},{"id":"next","title":"From A8 horizon rejection to Zone 2","reveal":["F","H","E"],"lede":"More information and longer training did not solve progression; execution semantics are the next isolated variable.","story":"<p>EXP-0008 rejected the claim that A8 only needed a longer adaptation horizon: neither continued arm improved final held-out progress at 250,880 transitions. The sampled training policy nevertheless reached Floor 3 while argmax evaluation reached only Floor 2. <mark>EXP-0009 freezes every checkpoint and tests whether reproducible stochastic execution reaches Zone 2 across multiple unseen seeds.</mark> If it does not, the next intervention corrects truncation bootstrapping and reward-objective scale before introducing another architecture.</p>","flow":[["K","E","frozen A2/A8 checkpoints",{"changed_blocks":["evaluation"]}],["E","W","same unseen seeds",{"count":24}],["W","E","argmax + two sample streams",{"policy_seeds":[0,91001,91002]}],["E","D","Zone 2 gate",{"distinct_seeds":3,"repeated_seeds":2}]]},{"id":"all","title":"The whole agent system","reveal":[],"lede":"Explore every building block, version lineage, flow, decision, and open question.","story":"<p>Choose a flow at bottom left. Hover any structure for its summary, click to pin it, and use the arrow to go inside. The <mark>Open questions</mark> tab is the forward work queue; resolved questions preserve why the current design exists.</p>","flow":null}];
const HOW_HTML = "<div class=\"eyebrow\">AutoDancer · live-game RL</div><h1 class=\"t\">How it is built</h1><div class=\"sub\">one real engine loop, many isolated actors, one shared learner</div>\n<h3 class=\"sec\">Current contract</h3><p><strong>Windows · NecroDancer v4.2.1-b5713 · Bard · normal seeded All Zones · schema 9.</strong> Python owns exactly N hidden workers and talks to each through a dedicated duplex named pipe.</p>\n<h3 class=\"sec\">Default learning unit</h3><pre>8 workers × 128 transitions\n→ stable [time, worker] rollout\n→ 32-step recurrent chunks\n→ 4 clipped PPO epochs\n→ one new policy version</pre>\n<h3 class=\"sec\">Version boundaries</h3><p>Observation schema, model architecture, PPO configuration, and reward specification are stored with checkpoints. Exact resume rejects mismatches; cross-version transfer must use an explicit warm-start path.</p>\n<h3 class=\"sec\">Source map</h3><pre>mods/AutoDancer/scripts/\n  AutoDancer.lua        engine hooks and telemetry\n  Bridge.lua            command acceptance\nsrc/autodancer/\n  live/                 protocol, pipe, supervisor\n  envs/                 live and vector interfaces\n  observation.py        schema-to-tensor contract\n  memory.py             persistent floor map\n  rewards.py            versioned reward tracker\n  training/\n    model.py            recurrent actor-critic\n    action_contract.py  versioned policy-side action masks\n    representation.py   sensitivity and gradient gates\n    architecture8_compare.py  initial A8 decision gates\n    architecture8_horizon_compare.py  long-horizon A8 gates\n    async_collector.py  versioned actor scheduler\n    ppo.py              recurrent PPO and checkpoints\n    baseline.py         deterministic/stochastic evaluation\n    stochastic_policy_compare.py  Zone 2 execution-mode gate\n    dashboard.py        local symbolic telemetry\ndocs/agent-system/\n  atlas/data.mjs        authored system definition\n  atlas.html            generated interactive atlas\n  SYSTEM.md             generated text twin</pre>\n<h3 class=\"sec\">Evidence rule</h3><p>Shaped return is never a promotion metric. The system compares gameplay on held-out seeds under predeclared execution semantics and records accepted and rejected hypotheses with immutable experiment decisions.</p>";

function buildWorldScene(){

  else { FLOWS.forEach(f=>{ if(S.flowSel!=='both'&&f.id!==S.flowSel)return; f.hops.forEach((h,i)=>sceneHops.push({flow:f.id,idx:i,from:h[0],to:h[1],label:h[2],payload:h[3],bend:h[4]||'xy'})); }); }
}
function bendFor(a,b){ const t=FLOWS[0].hops.find(h=>h[0]===a&&h[1]===b)||FLOWS[1].hops.find(h=>h[0]===a&&h[1]===b); return t?(t[4]||'xy'):'yx'; }
function buildInsideScene(n){
  const steps=n.steps||[]; sceneNodes=steps.map((s,i)=>({id:'s'+i,code:String(i+1),name:s[0],short:s[0],desc:s[1],gx:2+i*3.4,gy:2+i*0.6,w:2,d:2,h:34,inside:true}));
  sceneHops=[]; for(let i=0;i<steps.length-1;i++) sceneHops.push({flow:'inside',idx:i,from:'s'+i,to:'s'+(i+1),label:steps[i][0]+' → '+steps[i+1][0],payload:{step:i+1,handsOff:steps[i+1][0]},bend:'xy'});
}
function hopPath(h){
  const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); if(!A||!B) return null;
  const [ax,ay]=center(A), [bx,by]=center(B); const mid = h.bend==='xy' ? [bx,ay] : [ax,by];
  const g=[[ax,ay],mid,[bx,by]].filter((p,i,arr)=>i===0||p[0]!==arr[i-1][0]||p[1]!==arr[i-1][1]);
  const scr=g.map(p=>P(p[0],p[1],0)); let len=0; const seg=[]; for(let i=1;i<scr.length;i++){const l=Math.hypot(scr[i][0]-scr[i-1][0],scr[i][1]-scr[i-1][1]);seg.push(l);len+=l;}
  return {grid:g,scr,seg,len};
}
function pointAt(path,t){ let d=t*path.len; for(let i=0;i<path.seg.length;i++){ if(d<=path.seg[i]||i===path.seg.length-1){const u=path.seg[i]?Math.min(1,d/path.seg[i]):1;const a=path.scr[i],b=path.scr[i+1];return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];} d-=path.seg[i]; } return path.scr[0]; }

function initPackets(){ S.packets=[]; const flows=[...new Set(sceneHops.map(h=>h.flow))]; flows.forEach(f=>S.packets.push({flow:f,hop:0,t:0,speed:.5,pause:0})); S.selPacket=null; }

function advance(p,dt){ const hs=hopsOf(p.flow); if(!hs.length)return; if(p.pause>0){p.pause-=dt;return;} const h=hs[p.hop]; if(!h||!h.path){p.hop=(p.hop+1)%hs.length;return;} p.t+=dt*p.speed*(320/Math.max(120,h.path.len)); if(p.t>=1){p.t=0;p.hop=(p.hop+1)%hs.length;p.pause=(p.hop===0?1.2:.35);} }

  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
